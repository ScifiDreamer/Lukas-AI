<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Lukáš N. | Hry a utilitky</title>
  <style>
    :root{--bg:#07111f;--panel:#101d30;--card:#17263b;--text:#f7f9fc;--muted:#aebbd0;--line:#2b3c55;--accent:#68a8ff;--accent2:#55dfb2;--danger:#ff8c8c;--shadow:0 12px 32px #0005}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:17px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0,#173257 0,transparent 38%),var(--bg);color:var(--text)}
    button,input,a{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;padding:clamp(12px,2vw,24px);max-width:1500px;margin:auto}
    header{display:flex;align-items:end;justify-content:space-between;gap:18px}.brand h1{font-size:clamp(28px,4vw,48px);line-height:1;margin:0}.brand p{margin:7px 0 0;color:var(--muted);font-size:clamp(15px,1.5vw,19px)}
    .github{color:var(--text);text-decoration:none;border:1px solid var(--line);background:#ffffff0b;padding:10px 14px;border-radius:12px;white-space:nowrap}.github:hover{border-color:var(--accent)}
    .controls{display:grid;grid-template-columns:auto minmax(190px,430px) auto;gap:10px;align-items:center}.tabs{display:flex;gap:8px}.tab,.page-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 15px;border-radius:12px;cursor:pointer;font-weight:700}.tab[aria-selected="true"]{background:var(--accent);color:#061325;border-color:transparent}.tab .count{opacity:.75;font-weight:600}.search{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:12px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #68a8ff33}.status{color:var(--muted);white-space:nowrap;text-align:right}
    main{min-height:0}.grid{height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:12px}.card{min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:clamp(14px,1.7vw,22px);border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#ffffff09,transparent),var(--card);color:var(--text);text-decoration:none;box-shadow:var(--shadow);transition:.15s transform,.15s border-color}.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}.card h2{font-size:clamp(18px,1.7vw,24px);line-height:1.15;margin:0;overflow-wrap:anywhere}.card small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.open{color:var(--accent2);font-weight:800}
    .message{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:20px;border:1px dashed var(--line);border-radius:16px;padding:24px}.message strong{display:block;color:var(--text);font-size:24px;margin-bottom:8px}.error{color:var(--danger)}
    footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;color:var(--muted)}.pager{display:flex;align-items:center;gap:10px}.page-btn{padding:8px 14px}.page-btn:disabled{opacity:.35;cursor:not-allowed}.page-info{text-align:center;min-width:100px}.hint{text-align:right;font-size:14px}
    @media(max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}.controls{grid-template-columns:1fr 1fr}.status{display:none}.tabs{grid-column:1/-1}.tab{flex:1}.hint{display:none}}
    @media(max-width:650px){body{font-size:16px}.app{padding:10px;gap:8px}.github{display:none}.controls{grid-template-columns:1fr}.tabs{grid-column:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}.card{padding:12px}.card small{display:none}footer{grid-template-columns:1fr}.pager{justify-content:center}footer>span{display:none}}
    @media(max-height:720px){.brand p{display:none}.app{padding:10px;gap:8px}.card{padding:12px}.card small{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Lukáš N.</h1><p>Hry a praktické HTML utilitky vytvořené s pomocí AI</p></div>
    <a class="github" href="https://github.com/ScifiDreamer/Lukas-AI" target="_blank" rel="noopener noreferrer">Otevřít repozitář</a>
  </header>

  <section class="controls" aria-label="Filtrování aplikací">
    <div class="tabs" role="tablist">
      <button class="tab" type="button" data-category="hry" role="tab" aria-selected="true">🎮 Hry <span class="count" id="gamesCount"></span></button>
      <button class="tab" type="button" data-category="utilitky" role="tab" aria-selected="false">🛠️ Utilitky <span class="count" id="toolsCount"></span></button>
    </div>
    <input id="search" class="search" type="search" placeholder="Hledat podle názvu…" aria-label="Hledat podle názvu">
    <div class="status" id="status" aria-live="polite">Načítám obsah…</div>
  </section>

  <main id="main"><div class="message"><div><strong>Načítám…</strong>Čtu HTML soubory z GitHubu.</div></div></main>

  <footer>
    <span id="shown"></span>
    <div class="pager">
      <button id="prev" class="page-btn" type="button" aria-label="Předchozí stránka">‹</button>
      <span id="pageInfo" class="page-info">1 / 1</span>
      <button id="next" class="page-btn" type="button" aria-label="Další stránka">›</button>
    </div>
    <span class="hint">Nové soubory se zobrazí automaticky.</span>
  </footer>
</div>
<script>
(() => {
  'use strict';
  const OWNER='ScifiDreamer', REPO='Lukas-AI', BRANCH='main';
  const API=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
  const PAGES=`https://${OWNER.toLowerCase()}.github.io/${REPO}/`;
  const state={all:[],category:'hry',query:'',page:1,perPage:12};
  const el={main:document.querySelector('#main'),search:document.querySelector('#search'),status:document.querySelector('#status'),prev:document.querySelector('#prev'),next:document.querySelector('#next'),pageInfo:document.querySelector('#pageInfo'),shown:document.querySelector('#shown'),gamesCount:document.querySelector('#gamesCount'),toolsCount:document.querySelector('#toolsCount')};

  function category(path){const first=path.split('/')[0].toLocaleLowerCase('cs');if(first==='hry')return'hry';if(first==='utilitky'||first==='utilityky'||first==='utility')return'utilitky';return null}
  function label(path){const file=path.split('/').pop().replace(/\.html?$/i,'');return file.replace(/[-_]+/g,' ').replace(/\s+v\d+(?:[.\s_-]\d+)*\s*$/i,'').replace(/\s+/g,' ').trim()}
  function href(path){return PAGES+path.split('/').map(encodeURIComponent).join('/')}
  function recalcPerPage(){const w=innerWidth,h=innerHeight;const cols=w<=650?2:w<=980?3:5;const rows=h<=560?2:h<=720?3:4;state.perPage=cols*rows}
  function filtered(){return state.all.filter(x=>x.category===state.category&&x.name.toLocaleLowerCase('cs').includes(state.query))}
  function render(){
    recalcPerPage();const list=filtered(),pages=Math.max(1,Math.ceil(list.length/state.perPage));state.page=Math.min(Math.max(1,state.page),pages);const start=(state.page-1)*state.perPage,visible=list.slice(start,start+state.perPage);
    if(!visible.length){el.main.innerHTML='<div class="message"><div><strong>Nic nenalezeno</strong>Zkus jiný výraz nebo druhou kategorii.</div></div>'}
    else{const grid=document.createElement('div');grid.className='grid';visible.forEach(item=>{const a=document.createElement('a');a.className='card';a.href=href(item.path);a.target='_blank';a.rel='noopener noreferrer';a.innerHTML=`<h2></h2><small></small><span class="open">Spustit ↗</span>`;a.querySelector('h2').textContent=item.name;a.querySelector('small').textContent=item.path;grid.append(a)});el.main.replaceChildren(grid)}
    el.pageInfo.textContent=`${state.page} / ${pages}`;el.prev.disabled=state.page<=1;el.next.disabled=state.page>=pages;el.shown.textContent=list.length?`Zobrazeno ${start+1}–${Math.min(start+state.perPage,list.length)} z ${list.length}`:'0 položek';
  }
  document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===btn)));state.category=btn.dataset.category;state.page=1;render()}));
  el.search.addEventListener('input',()=>{state.query=el.search.value.trim().toLocaleLowerCase('cs');state.page=1;render()});
  el.prev.addEventListener('click',()=>{state.page--;render()});el.next.addEventListener('click',()=>{state.page++;render()});
  addEventListener('resize',()=>{const old=state.perPage;recalcPerPage();if(old!==state.perPage){state.page=1;render()}});

  fetch(API,{headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw new Error(`GitHub API: ${r.status}`);return r.json()}).then(data=>{
    state.all=(data.tree||[]).filter(x=>x.type==='blob'&&/\.html?$/i.test(x.path)&&!/^index\.html?$/i.test(x.path)).map(x=>({path:x.path,name:label(x.path),category:category(x.path)})).filter(x=>x.category).sort((a,b)=>a.name.localeCompare(b.name,'cs',{numeric:true,sensitivity:'base'}));
    const games=state.all.filter(x=>x.category==='hry').length,tools=state.all.filter(x=>x.category==='utilitky').length;el.gamesCount.textContent=`(${games})`;el.toolsCount.textContent=`(${tools})`;el.status.textContent=`Celkem ${games+tools} aplikací`;render();
  }).catch(err=>{console.error(err);el.status.textContent='Načtení selhalo';el.main.innerHTML='<div class="message error"><div><strong>Obsah se nepodařilo načíst</strong>Zkontroluj připojení, veřejný repozitář a názvy složek „hry“ a „Utilitky“. Potom stránku obnov.</div></div>';el.prev.disabled=el.next.disabled=true});
})();
</script>
</body>
</html>
