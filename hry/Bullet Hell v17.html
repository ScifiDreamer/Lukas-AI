<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lukášův Bullet Hell · Default</title>
  <style>
    *{box-sizing:border-box}html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;overflow:hidden;background:#030712}
  </style>
</head>
<body>
  <iframe id="game" title="Lukášův Bullet Hell" src="Bullet%20Hell%20v16.html"></iframe>
  <script>
    const frame=document.getElementById('game');
    const presetScript=`(()=>{
      const defaultPreset={bulletSpeed:1000,fireRate:33,magnet:true,maxPower:100,shotAngle:15,enemyRate:10,spread:99,rareChance:0};
      presets.default={...defs,...defaultPreset};
      const presetBar=document.querySelector('.presets');
      if(presetBar&&!presetBar.querySelector('[data-pre="default"]')){
        const button=document.createElement('button');
        button.type='button';
        button.dataset.pre='default';
        button.textContent='DEFAULT';
        button.title='Bullet hell bez vzácných power-upů';
        button.onclick=()=>{
          cfg={...presets.default};
          controls();
        };
        presetBar.prepend(button);
      }
      if(!localStorage.getItem('LukasBulletHellCfg'))
        cfg={...presets.default};
    })()`;
    frame.addEventListener('load',()=>{
      try{frame.contentWindow.eval(presetScript)}
      catch(error){console.error('Default preset could not be installed:',error)}
    });
  </script>
</body>
</html>
