function aiMoves(){var moves=[],own=current().id;state.board.forEach(function(owner,k){if(owner!==own)return;dirs.forEach(function(d){var m=legal(k,d);if(m.ok){var value=Math.random()*10+m.group.length*2;if(m.type==='push')value+=25+m.enemies.length*12+(m.out?100:0);moves.push({key:k,dir:d,value:value})}})});return moves}
function scheduleAI(){if(state.aiTimer||state.winner!==null||!state.aiPlayers[current().id])return;state.aiTimer=setTimeout(function(){state.aiTimer=null;if(state.winner!==null||!state.aiPlayers[current().id])return;var moves=aiMoves();if(!moves.length){status('AI nemá platný tah.',true);return}moves.sort(function(a,b){return b.value-a.value});apply(moves[0].key,moves[0].dir)},650)}
function fullscreenElement(){return document.fullscreenElement||document.webkitFullscreenElement}function updateFullscreenButton(){var b=el('fullscreenBtn'),on=!!fullscreenElement();b.setAttribute('aria-pressed',on?'true':'false');b.title=on?'Ukončit celou obrazovku':'Zobrazit na celou obrazovku'}function toggleFullscreen(){var root=document.documentElement;if(!fullscreenElement()){var req=root.requestFullscreen||root.webkitRequestFullscreen;if(req){var result=req.call(root);if(result&&result.catch)result.catch(function(){status('Prohlížeč nepovolil režim celé obrazovky.',true)})}else status('Tento prohlížeč nepodporuje režim celé obrazovky.',true)}else{var exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)exit.call(document)}}el('menuToggle').onclick=toggleMenu;el('colorPreset').addEventListener('change',function(){applyPreset(this.value)});el('randomColors').onclick=randomizeColors;el('boardRadius').addEventListener('input',function(){el('boardRadiusValue').textContent=this.value});el('cellColor').addEventListener('input',function(){state.cellColor=this.value;document.documentElement.style.setProperty('--cell',this.value)});el('boardSize').addEventListener('input',function(){state.boardSize=Number(this.value);updateBoardSize()});el('changeBackground').addEventListener('change',function(){state.changeBackground=this.checked;render(false)});el('arrowColor').addEventListener('input',function(){state.arrowColor=this.value;updateArrowColor()});el('bigScoreBtn').onclick=function(){state.bigScore=!state.bigScore;renderBigScores()};el('fullscreenBtn').onclick=toggleFullscreen;document.addEventListener('fullscreenchange',updateFullscreenButton);document.addEventListener('webkitfullscreenchange',updateFullscreenButton);updateFullscreenButton();el('board').addEventListener('pointermove',pointerMove);el('board').addEventListener('pointerup',pointerUp);el('board').addEventListener('pointercancel',function(){state.drag=null;state.aim=null;el('arrow').style.display='none';render()});el('resetBtn').onclick=reset;el('applyBtn').onclick=applySettings;el('playersCount').onchange=function(){state.playerCount=Number(this.value);el('p3row').style.display=state.playerCount===3?'grid':'none';el('ai3row').style.display=state.playerCount===3?'flex':'none'};function undoMove(){var prev=state.history.pop();if(prev)restore(prev)}el('undoBtn').onclick=undoMove;el('hudUndoBtn').onclick=undoMove;var bw=el('boardwrap');bw.addEventListener('touchstart',beginPinch,{passive:false});bw.addEventListener('touchmove',movePinch,{passive:false});bw.addEventListener('touchend',endPinch,{passive:false});bw.addEventListener('touchcancel',endPinch,{passive:false});setupSelects();reset();
})();
