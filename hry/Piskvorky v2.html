<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b18">
<title>Piškvorky</title>
<style>
:root{--bg1:#070816;--bg2:#11152d;--panel:rgba(15,18,40,.78);--line:rgba(255,255,255,.12);--text:#f8f9ff;--muted:#aeb6d5;--x:#b089ff;--o:#70f4df;--accent:#7c6cff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 18% 15%,rgba(124,108,255,.24),transparent 31%),radial-gradient(circle at 85% 78%,rgba(33,212,194,.17),transparent 34%),linear-gradient(145deg,var(--bg1),var(--bg2));background-attachment:fixed}
button{font:inherit;color:inherit;border:0;cursor:pointer}.app{width:min(1180px,calc(100% - 28px));min-height:100vh;margin:auto;padding:26px 0;display:grid;place-items:center}.shell{width:100%;display:grid;grid-template-columns:minmax(250px,310px) minmax(460px,700px);gap:24px;justify-content:center}.panel,.game{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(20px);border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.42)}.panel{padding:24px;display:flex;flex-direction:column}.brand{display:flex;gap:13px;align-items:center;margin-bottom:24px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--accent),#21d4c2)}h1{font-size:23px;margin:0}.subtitle{font-size:12px;color:var(--muted);margin-top:4px}.label{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#929bc0;font-weight:800;margin:0 0 9px 3px}.seg{display:grid;gap:7px;padding:6px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:16px;margin-bottom:19px}.seg.two{grid-template-columns:1fr 1fr}.seg-btn,.mark-btn{padding:11px 7px;border-radius:11px;background:transparent;color:var(--muted);font-size:13px;font-weight:750}.seg-btn.active,.mark-btn.active{background:linear-gradient(135deg,#7c6cff,#604bd7);color:white;box-shadow:0 7px 18px rgba(89,71,208,.32)}.choose{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:20px}.mark-btn{border:1px solid var(--line);background:rgba(255,255,255,.03)}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:auto}.score{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:14px;padding:10px 4px;text-align:center}.score strong{font-size:19px;display:block}.score span{font-size:9px;color:var(--muted);text-transform:uppercase}.score.x strong{color:var(--x)}.score.o strong{color:var(--o)}.reset{margin-top:8px;background:none;color:#7f88a8;font-size:11px;padding:7px}.game{padding:25px;min-height:650px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.turn{display:flex;align-items:center;gap:11px}.turn-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:23px;font-weight:900;background:rgba(124,108,255,.14);color:var(--x)}.status-title{font-weight:800;font-size:15px}.status-sub{font-size:11px;color:var(--muted);margin-top:3px}.icon-btn{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.board-wrap{position:relative;width:100%;max-width:620px;aspect-ratio:1/1;margin:auto;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:22px;background:rgba(3,5,16,.5);scrollbar-width:thin;touch-action:pan-x pan-y}.board{display:grid}.board.classic{width:100%;height:100%;padding:10px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px}.board.five{--size:42px;grid-template-columns:repeat(61,var(--size));grid-template-rows:repeat(61,var(--size));width:max-content;height:max-content;gap:1px;background:rgba(255,255,255,.12);padding:1px}.cell{min-width:0;min-height:0;width:100%;height:100%;aspect-ratio:1/1;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.11);display:grid;place-items:center;font-size:clamp(45px,8vw,78px);font-weight:900;line-height:1;padding:0;overflow:hidden;user-select:none}.cell:hover:not(.taken){background:rgba(255,255,255,.1)}.five .cell{width:var(--size);height:var(--size);min-width:var(--size);min-height:var(--size);aspect-ratio:1/1;border:0;border-radius:0;font-size:30px;background:#11152d}.five .cell:hover:not(.taken){background:#252b50}.cell.x{color:var(--x);text-shadow:0 0 18px rgba(124,108,255,.4)}.cell.o{color:var(--o);text-shadow:0 0 18px rgba(33,212,194,.35)}.cell.win{background:rgba(255,255,255,.18)!important;box-shadow:inset 0 0 0 2px white}.actions{display:grid;grid-template-columns:1fr auto auto;gap:9px;width:100%;max-width:620px;margin:18px auto 0}.primary,.secondary{padding:13px 15px;border-radius:14px;font-weight:800}.primary{background:linear-gradient(135deg,#7c6cff,#604bd7)}.secondary{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}.zoom.hidden{display:none}.hint{text-align:center;color:#737c9e;font-size:10px;margin-top:10px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:white;color:#17182a;padding:10px 16px;border-radius:12px;font-weight:800;transition:.2s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.shell{grid-template-columns:1fr;max-width:680px}.panel{order:2}.game{min-height:auto}.scores{margin-top:0}}@media(max-width:500px){.app{width:calc(100% - 14px);padding:8px 0}.game,.panel{padding:15px;border-radius:22px}.game{min-height:0}.board-wrap{border-radius:16px}.board.classic{gap:7px;padding:7px}.cell{border-radius:14px}.actions{grid-template-columns:1fr auto}.zoom{display:none}.top{margin-bottom:12px}}
</style>
</head><body><main class="app"><div class="shell">
<aside class="panel"><div class="brand"><div class="logo">#</div><div><h1>Piškvorky</h1><div class="subtitle">Klasika i česká varianta na 5</div></div></div>
<div class="label">Varianta hry</div><div class="seg two"><button class="seg-btn active" data-variant="classic">3 × 3</button><button class="seg-btn" data-variant="five">5 v řadě</button></div>
<div class="label">Herní režim</div><div class="seg two"><button class="seg-btn active" data-mode="ai">Proti AI</button><button class="seg-btn" data-mode="pvp">Dva hráči</button></div>
<div class="label">Hraješ za</div><div class="choose"><button class="mark-btn active" data-mark="X">✕ Křížky</button><button class="mark-btn" data-mark="O">○ Kolečka</button></div>
<div class="scores"><div class="score x"><strong id="sx">0</strong><span>Křížky</span></div><div class="score"><strong id="sd">0</strong><span>Remízy</span></div><div class="score o"><strong id="so">0</strong><span>Kolečka</span></div></div><button class="reset" id="resetScore">Vynulovat skóre</button></aside>
<section class="game"><div class="top"><div class="turn"><div class="turn-icon" id="turnIcon">×</div><div><div class="status-title" id="title">Jsi na tahu</div><div class="status-sub" id="sub">Umísti křížek na herní plochu</div></div></div><button class="icon-btn" id="sound">🔊</button></div>
<div class="board-wrap" id="wrap"><div class="board classic" id="board"></div></div>
<div class="actions"><button class="primary" id="newGame">Nová hra</button><button class="secondary" id="undo">↶ Vrátit</button><button class="secondary zoom hidden" id="center">◎ Střed</button></div><div class="hint" id="hint">První získá tři symboly v řadě</div></section>
</div></main><div class="toast" id="toast"></div>
<script>
(()=>{const N=61,C=(N-1)/2;let variant='classic',mode='ai',human='X',current='X',over=false,sound=true,board=[],history=[],scores={X:0,O:0,D:0},timer=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],el=$('#board'),wrap=$('#wrap');
const idx=(r,c)=>r*N+c, other=m=>m==='X'?'O':'X';function tone(f=440){if(!sound)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.08);o.stop(a.currentTime+.08)}catch(e){}}
function build(){clearTimeout(timer);el.innerHTML='';over=false;current='X';history=[];if(variant==='classic'){board=Array(9).fill('');el.className='board classic';for(let i=0;i<9;i++)cell(i)}else{board=Array(N*N).fill('');el.className='board five';const f=document.createDocumentFragment();for(let i=0;i<N*N;i++)f.appendChild(makeCell(i));el.appendChild(f);requestAnimationFrame(centerBoard)}update();if(mode==='ai'&&human==='O')timer=setTimeout(aiMove,350)}function makeCell(i){const b=document.createElement('button');b.className='cell';b.dataset.i=i;b.onclick=()=>play(i);b.setAttribute('aria-label','Prázdné pole');return b}function cell(i){el.appendChild(makeCell(i))}function centerBoard(){wrap.scrollLeft=(el.scrollWidth-wrap.clientWidth)/2;wrap.scrollTop=(el.scrollHeight-wrap.clientHeight)/2}
function place(i,m){board[i]=m;const c=el.children[i];c.textContent=m==='X'?'×':'○';c.classList.add('taken',m.toLowerCase());tone(m==='X'?420:610)}function play(i){if(over||board[i]||(mode==='ai'&&current!==human))return;history.push(board.slice());place(i,current);after(i)}
function winningLine(last,m){if(variant==='classic'){const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return w.find(a=>a.every(i=>board[i]===m))||null}const r=Math.floor(last/N),c=last%N;for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){let a=[last];for(const s of [-1,1])for(let k=1;k<5;k++){const rr=r+dr*k*s,cc=c+dc*k*s;if(rr<0||rr>=N||cc<0||cc>=N||board[idx(rr,cc)]!==m)break;a.push(idx(rr,cc))}if(a.length>=5)return a}return null}
function after(i){const line=winningLine(i,current);if(line){over=true;scores[current]++;line.forEach(x=>el.children[x].classList.add('win'));$('#title').textContent=(mode==='ai'?(current===human?'Vyhráváš!':'AI vítězí'):`Hráč ${current} vítězí!`);$('#sub').textContent=variant==='five'?'Pět symbolů v řadě rozhodlo':'Tři symboly v řadě rozhodly';save();return}if(variant==='classic'&&board.every(Boolean)){over=true;scores.D++;$('#title').textContent='Remíza';save();return}current=other(current);update();if(mode==='ai'&&current!==human)timer=setTimeout(aiMove,300)}
function candidates(){if(variant==='classic')return board.map((v,i)=>v?null:i).filter(i=>i!==null);const set=new Set();let any=false;for(let i=0;i<board.length;i++)if(board[i]){any=true;const r=Math.floor(i/N),c=i%N;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N&&!board[idx(rr,cc)])set.add(idx(rr,cc))}}return any?[...set]:[idx(C,C)]}
function scoreMove(i,m){board[i]=m;let val=winningLine(i,m)?100000:0;const r=variant==='five'?Math.floor(i/N):Math.floor(i/3),c=variant==='five'?i%N:i%3,size=variant==='five'?N:3;for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){let run=1,open=0;for(const s of [-1,1]){for(let k=1;k<5;k++){const rr=r+dr*k*s,cc=c+dc*k*s;if(rr<0||rr>=size||cc<0||cc>=size)break;const j=variant==='five'?idx(rr,cc):rr*3+cc;if(board[j]===m)run++;else{if(!board[j])open++;break}}}val+=run*run*run*(open+1)}board[i]='';return val}
function aiMove(){if(over||current===human)return;const cs=candidates();let best=cs[0],bv=-1;for(const i of cs){const attack=scoreMove(i,current),block=scoreMove(i,human)*.92,center=variant==='five'?20-Math.hypot(Math.floor(i/N)-C,i%N-C)/5:0,v=Math.max(attack,block)+center+Math.random();if(v>bv){bv=v;best=i}}history.push(board.slice());place(best,current);after(best)}
function update(){const x=current==='X';$('#turnIcon').textContent=x?'×':'○';$('#turnIcon').style.color=x?'var(--x)':'var(--o)';if(mode==='ai'){$('#title').textContent=current===human?'Jsi na tahu':'AI je na tahu';$('#sub').textContent=current===human?`Umísti ${human==='X'?'křížek':'kolečko'} na herní plochu`:'Hledá nejlepší tah'}else{$('#title').textContent=`Hráč ${current} je na tahu`;$('#sub').textContent='Umísti symbol na herní plochu'}}function save(){$('#sx').textContent=scores.X;$('#so').textContent=scores.O;$('#sd').textContent=scores.D;localStorage.setItem('piskvorkyV2',JSON.stringify(scores))}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
function undo(){if(!history.length||over){toast(over?'Začni novou hru':'Není co vrátit');return}board=history.pop();if(mode==='ai'&&history.length){board=history.pop();current=human}else current=other(current);[...el.children].forEach((c,i)=>{c.className='cell';c.textContent='';if(board[i]){c.textContent=board[i]==='X'?'×':'○';c.classList.add('taken',board[i].toLowerCase())}});update()}
try{scores={...scores,...JSON.parse(localStorage.getItem('piskvorkyV2')||'{}')}}catch(e){}save();$$('[data-variant]').forEach(b=>b.onclick=()=>{$$('[data-variant]').forEach(x=>x.classList.remove('active'));b.classList.add('active');variant=b.dataset.variant;$('#hint').textContent=variant==='five'?'Pět v řadě • pole lze posouvat tažením':'První získá tři symboly v řadě';$('#center').classList.toggle('hidden',variant!=='five');build()});$$('[data-mode]').forEach(b=>b.onclick=()=>{$$('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;build()});$$('[data-mark]').forEach(b=>b.onclick=()=>{$$('[data-mark]').forEach(x=>x.classList.remove('active'));b.classList.add('active');human=b.dataset.mark;build()});$('#newGame').onclick=build;$('#undo').onclick=undo;$('#center').onclick=centerBoard;$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊':'🔇'};$('#resetScore').onclick=()=>{scores={X:0,O:0,D:0};save();toast('Skóre vynulováno')};build();})();
</script></body></html>
