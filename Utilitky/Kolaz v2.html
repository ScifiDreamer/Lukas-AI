<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FotoKoláž</title>
  <style>
    :root {
      --bg: #f5f7fb; --surface: rgba(255,255,255,.86); --surface-solid:#fff;
      --text:#172033; --muted:#667085; --line:#e3e8f0; --primary:#635bff;
      --primary-2:#8b5cf6; --danger:#dc2626; --success:#087f5b;
      --shadow:0 24px 70px rgba(26,36,62,.12); --radius:22px;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:
      radial-gradient(circle at 10% 0%,rgba(99,91,255,.16),transparent 34rem),
      radial-gradient(circle at 100% 20%,rgba(14,165,233,.12),transparent 30rem),var(--bg)}
    button,input,select{font:inherit} button{touch-action:manipulation}
    .shell{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:38px 0 56px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;color:#fff;background:linear-gradient(135deg,var(--primary),#00a7e8);box-shadow:0 12px 28px rgba(99,91,255,.28);font-size:24px}
    h1{margin:0;font-size:clamp(1.45rem,3vw,2rem);letter-spacing:-.04em}.subtitle{margin:4px 0 0;color:var(--muted);font-size:.94rem}
    .badge{padding:8px 12px;border:1px solid rgba(99,91,255,.2);border-radius:999px;background:rgba(99,91,255,.08);color:#4f46e5;font-weight:700;font-size:.8rem}
    .app{background:var(--surface);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(16px);overflow:hidden}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);background:rgba(255,255,255,.45)}
    .step{position:relative;padding:18px 24px;color:var(--muted);font-size:.86rem;font-weight:700}.step b{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;background:#edf0f5;color:#667085}.step.active{color:var(--primary)}.step.active b,.step.done b{background:var(--primary);color:#fff}.step.active:after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:3px;border-radius:999px;background:linear-gradient(90deg,var(--primary),#00a7e8)}
    main{padding:28px}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:26px}.panel{min-width:0}
    .dropzone{position:relative;display:grid;place-items:center;min-height:238px;padding:28px;text-align:center;border:2px dashed #cbd3df;border-radius:18px;background:linear-gradient(180deg,rgba(248,250,252,.8),rgba(244,246,251,.8));transition:.2s ease;cursor:pointer;outline:none}.dropzone:hover,.dropzone.drag,.dropzone:focus-visible{border-color:var(--primary);background:rgba(99,91,255,.055);transform:translateY(-1px)}
    .upload-icon{display:grid;place-items:center;width:66px;height:66px;border-radius:20px;background:#fff;box-shadow:0 12px 30px rgba(32,45,72,.12);font-size:30px}.dropzone h2{margin:17px 0 6px;font-size:1.18rem}.dropzone p{margin:0;color:var(--muted);line-height:1.55}.link{color:var(--primary);font-weight:800}.small{font-size:.82rem!important;margin-top:8px!important}
    input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
    .toolbar{display:none;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px}.toolbar.visible{display:flex}.toolbar h3{margin:0;font-size:1rem}.toolbar span{color:var(--muted);font-size:.88rem}.text-btn{border:0;background:transparent;color:var(--danger);font-weight:750;cursor:pointer;padding:8px}
    .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}.thumb{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;background:#e9edf3;border:1px solid var(--line)}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .num{position:absolute;left:7px;bottom:7px;background:rgba(17,24,39,.72);color:#fff;border-radius:7px;padding:3px 6px;font-size:.7rem;font-weight:800;backdrop-filter:blur(6px)}.remove{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:50%;color:#fff;background:rgba(17,24,39,.68);cursor:pointer;opacity:0;transition:.15s}.thumb:hover .remove,.remove:focus{opacity:1}
    aside{padding:20px;border-radius:18px;background:#f8fafc;border:1px solid var(--line);align-self:start}.aside-title{margin:0 0 18px;font-size:1rem}.field{margin-bottom:16px}.field label{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:.83rem;font-weight:750}.hint{color:var(--muted);font-weight:500}
    input[type=text],input[type=number],select,input[type=color]{width:100%;height:43px;padding:0 12px;border:1px solid #d6dde8;border-radius:10px;background:var(--surface-solid);color:var(--text);outline:none;transition:.15s}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,91,255,.12)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.color-row{display:grid;grid-template-columns:1fr 48px;gap:8px}input[type=color]{padding:5px;cursor:pointer}
    input[type=range]{width:100%;accent-color:var(--primary)}
    .summary{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.84rem}.summary strong{color:var(--text);text-align:right}
    .primary{position:relative;width:100%;min-height:49px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));font-weight:800;cursor:pointer;box-shadow:0 12px 25px rgba(99,91,255,.23);transition:.18s}.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 15px 30px rgba(99,91,255,.3)}.primary:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}.primary.busy{color:transparent}.primary.busy:after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .privacy{display:flex;gap:8px;align-items:flex-start;margin:14px 2px 0;color:var(--muted);font-size:.76rem;line-height:1.45}
    .toast{position:fixed;left:50%;bottom:28px;z-index:10;transform:translate(-50%,30px);padding:12px 16px;border-radius:12px;background:#172033;color:#fff;box-shadow:0 14px 35px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    canvas{display:none}
    @media(max-width:780px){.shell{width:min(100% - 20px,680px);padding-top:18px}.badge{display:none}.steps .step{padding:14px 8px;text-align:center;font-size:.74rem}.step b{display:grid;margin:0 auto 5px}.step.active:after{left:8px;right:8px}main{padding:16px}.layout{grid-template-columns:1fr}.dropzone{min-height:210px}aside{padding:16px}.remove{opacity:1}}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1220;--surface:rgba(20,27,43,.88);--surface-solid:#171f31;--text:#f2f5fb;--muted:#a4aec0;--line:#2a3448;--shadow:0 26px 70px rgba(0,0,0,.35)}.app{border-color:#263147}.steps{background:rgba(20,27,43,.55)}.step b{background:#2a3448}.dropzone{background:linear-gradient(180deg,rgba(28,37,57,.8),rgba(22,30,47,.8));border-color:#465269}.upload-icon{background:#202a3f}aside{background:#121a2a}.badge{color:#b9b5ff}.thumb{background:#263147}input[type=text],input[type=number],select,input[type=color]{border-color:#364259}.primary{box-shadow:none}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="brand"><div class="logo" aria-hidden="true">◫</div><div><h1>FotoKoláž</h1><p class="subtitle">Spojte své vzpomínky do jednoho obrázku.</p></div></div><div class="badge">100% v prohlížeči</div></header>
  <section class="app">
    <nav class="steps" aria-label="Průběh"><div class="step active" id="s1"><b>1</b>Fotografie</div><div class="step" id="s2"><b>2</b>Nastavení</div><div class="step" id="s3"><b>3</b>Stažení</div></nav>
    <main><div class="layout">
      <section class="panel">
        <label class="dropzone" id="dropzone" tabindex="0" for="files">
          <input id="files" type="file" accept="image/*" multiple>
          <div><div class="upload-icon" aria-hidden="true">📷</div><h2>Přetáhněte sem fotografie</h2><p>nebo <span class="link">vyberte ze zařízení</span></p><p class="small">JPG, PNG, WebP • lze vybrat libovolný počet</p></div>
        </label>
        <div class="toolbar" id="toolbar"><div><h3>Vybrané fotografie</h3><span id="photoCount">0 fotografií</span></div><button class="text-btn" id="clearBtn" type="button">Odebrat vše</button></div>
        <div class="thumbs" id="thumbs" aria-live="polite"></div>
      </section>
      <aside>
        <h2 class="aside-title">Nastavení koláže</h2>
        <div class="field"><label for="layout">Rozložení <span class="hint" id="gridHint">automaticky</span></label><select id="layout"><option value="auto">Automatické</option><option value="square">Co nejčtvercovější</option><option value="wide">Na šířku</option><option value="tall">Na výšku</option></select></div>
        <div class="row"><div class="field"><label for="width">Šířka (px)</label><input id="width" type="number" value="2400" min="400" max="12000" step="100"></div><div class="field"><label for="ratio">Poměr stran</label><select id="ratio"><option value="auto">Podle mřížky</option><option value="1">1 : 1</option><option value="1.5">3 : 2</option><option value="1.7777778">16 : 9</option><option value="0.8">4 : 5</option></select></div></div>
        <div class="row"><div class="field"><label for="fit">Ořez fotografie</label><select id="fit"><option value="cover">Vyplnit (oříznout)</option><option value="contain">Celá fotografie</option></select></div><div class="field"><label for="format">Formát</label><select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div></div>
        <div class="field"><label for="gap">Mezery <span class="hint"><output id="gapOut">12</output> px</span></label><input id="gap" type="range" min="0" max="80" value="12"></div>
        <div class="field"><label for="radius">Zaoblení <span class="hint"><output id="radiusOut">8</output> %</span></label><input id="radius" type="range" min="0" max="35" value="8"></div>
        <div class="field"><label for="quality">Kvalita <span class="hint"><output id="qualityOut">92</output> %</span></label><input id="quality" type="range" min="45" max="100" value="92"></div>
        <div class="field"><label for="background">Pozadí</label><div class="color-row"><input id="backgroundText" type="text" value="#ffffff" maxlength="7" aria-label="Barva pozadí"><input id="background" type="color" value="#ffffff" aria-label="Vybrat barvu pozadí"></div></div>
        <div class="field"><label for="filename">Název souboru</label><input id="filename" type="text" value="moje-kolaz" maxlength="80"></div>
        <div class="summary"><span>Výstup</span><strong id="outputInfo">2400 × 2400 px</strong></div>
        <button class="primary" id="createBtn" type="button" disabled>Vytvořit a stáhnout koláž</button>
        <p class="privacy"><span>🔒</span><span>Fotografie neopouštějí vaše zařízení. Zpracování probíhá pouze v tomto prohlížeči.</span></p>
      </aside>
    </div></main>
  </section>
</div>
<canvas id="canvas"></canvas><div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { items: [] };
  const el = { files:$('files'),drop:$('dropzone'),thumbs:$('thumbs'),toolbar:$('toolbar'),count:$('photoCount'),create:$('createBtn'),layout:$('layout'),width:$('width'),ratio:$('ratio'),fit:$('fit'),format:$('format'),gap:$('gap'),radius:$('radius'),quality:$('quality'),bg:$('background'),bgText:$('backgroundText'),filename:$('filename'),canvas:$('canvas'),toast:$('toast') };
  const plural = n => n===1?'fotografie':(n>=2&&n<=4?'fotografie':'fotografií');
  function toast(msg){ el.toast.textContent=msg;el.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.toast.classList.remove('show'),2600) }
  function grid(){ const n=state.items.length||1; if(el.layout.value==='wide') return {c:Math.ceil(Math.sqrt(n*1.7)),r:0}; if(el.layout.value==='tall') return {c:Math.max(1,Math.floor(Math.sqrt(n/.75))),r:0}; const c=Math.ceil(Math.sqrt(n)); return {c,r:0}; }
  function dims(){ let {c}=grid(),r=Math.ceil((state.items.length||1)/c); const w=Math.max(400,Math.min(12000,+el.width.value||2400)); let h; if(el.ratio.value==='auto') h=Math.round(w*r/c); else h=Math.round(w/(+el.ratio.value)); return {w,h,c,r}; }
  function update(){ const n=state.items.length;el.toolbar.classList.toggle('visible',n>0);el.count.textContent=`${n} ${plural(n)}`;el.create.disabled=!n;const d=dims();$('gridHint').textContent=n?`${d.c} × ${d.r}`:'automaticky';$('outputInfo').textContent=`${d.w.toLocaleString('cs-CZ')} × ${d.h.toLocaleString('cs-CZ')} px`;$('s1').classList.toggle('done',n>0);$('s2').classList.toggle('active',n>0); }
  function render(){ el.thumbs.innerHTML='';state.items.forEach((it,i)=>{const card=document.createElement('div');card.className='thumb';card.innerHTML=`<img src="${it.url}" alt="Fotografie ${i+1}"><span class="num">${i+1}</span><button class="remove" type="button" aria-label="Odebrat fotografii ${i+1}">×</button>`;card.querySelector('button').onclick=()=>{URL.revokeObjectURL(it.url);state.items.splice(i,1);render();update()};el.thumbs.appendChild(card)});update() }
  function addFiles(files){ const valid=[...files].filter(f=>f.type.startsWith('image/')); if(!valid.length){toast('Vyberte prosím obrázky.');return} valid.forEach(file=>state.items.push({file,url:URL.createObjectURL(file)}));render();toast(`Přidáno: ${valid.length} ${plural(valid.length)}`) }
  el.files.onchange=e=>{addFiles(e.target.files);e.target.value=''};
  ['dragenter','dragover'].forEach(x=>el.drop.addEventListener(x,e=>{e.preventDefault();el.drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>el.drop.addEventListener(x,e=>{e.preventDefault();el.drop.classList.remove('drag')}));el.drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
  $('clearBtn').onclick=()=>{state.items.forEach(x=>URL.revokeObjectURL(x.url));state.items=[];render()};
  [el.layout,el.width,el.ratio].forEach(x=>x.addEventListener('input',update));
  [[el.gap,'gapOut'],[el.radius,'radiusOut'],[el.quality,'qualityOut']].forEach(([x,id])=>x.oninput=()=>$(id).value=x.value);
  el.bg.oninput=()=>el.bgText.value=el.bg.value;el.bgText.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(el.bgText.value))el.bg.value=el.bgText.value};
  function load(item){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=item.url})}
  function rounded(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h));ctx.clip()}
  async function make(){ if(!state.items.length)return;el.create.classList.add('busy');el.create.disabled=true;$('s3').classList.add('active');try{const imgs=await Promise.all(state.items.map(load));const {w,h,c,r}=dims();const canvas=el.canvas,ctx=canvas.getContext('2d',{alpha:false});canvas.width=w;canvas.height=h;ctx.fillStyle=/^#[0-9a-f]{6}$/i.test(el.bgText.value)?el.bgText.value:'#ffffff';ctx.fillRect(0,0,w,h);const gap=+el.gap.value,cw=(w-gap*(c+1))/c,ch=(h-gap*(r+1))/r,rad=Math.min(cw,ch)*(+el.radius.value/100);imgs.forEach((img,i)=>{const col=i%c,row=Math.floor(i/c),x=gap+col*(cw+gap),y=gap+row*(ch+gap);ctx.save();rounded(ctx,x,y,cw,ch,rad);const cover=el.fit.value==='cover',scale=cover?Math.max(cw/img.naturalWidth,ch/img.naturalHeight):Math.min(cw/img.naturalWidth,ch/img.naturalHeight),dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;ctx.drawImage(img,x+(cw-dw)/2,y+(ch-dh)/2,dw,dh);ctx.restore()});const type=el.format.value,q=+el.quality.value/100,ext=type==='image/png'?'png':type==='image/webp'?'webp':'jpg';const blob=await new Promise(res=>canvas.toBlob(res,type,q));if(!blob)throw new Error('Export se nezdařil');const clean=(el.filename.value||'moje-kolaz').replace(/[\\/:*?"<>|]+/g,'-').trim();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${clean}.${ext}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Koláž je hotová a stažená.')}catch(err){console.error(err);toast('Koláž se nepodařilo vytvořit.')}finally{el.create.classList.remove('busy');el.create.disabled=false}}
  el.create.onclick=make;update();
})();
</script>
</body>
</html>
