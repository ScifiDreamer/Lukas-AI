<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velikost složek v001</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--accent2:#60a5fa;--hover:#eff6ff;--folder:#e7a928;--danger:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#101828;--panel:#182230;--text:#f2f4f7;--muted:#98a2b3;--line:#344054;--hover:#1d2939}}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1200px;margin:auto;padding:22px}.header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:15px}.title h1{font-size:23px;margin:0}.title p{margin:4px 0 0;color:var(--muted);font-size:13px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer}button:hover{background:var(--hover)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #0000000b}.toolbar{padding:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}.crumbs{display:flex;gap:4px;align-items:center;flex:1;min-width:250px;overflow:auto}.crumb{white-space:nowrap;padding:6px 8px;border-radius:7px;cursor:pointer}.crumb:hover{background:var(--hover)}.sep{color:var(--muted)}
.progressWrap{height:5px;background:var(--line);position:relative;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}.progress.indeterminate{width:35%;animation:slide 1.2s infinite ease-in-out}@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
.status{padding:8px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600;user-select:none;cursor:pointer}th:nth-child(2),td:nth-child(2){width:160px;text-align:right}th:nth-child(3),td:nth-child(3){width:180px}tbody tr{cursor:default}tbody tr.folder{cursor:pointer}tbody tr:hover{background:var(--hover)}.name{display:flex;align-items:center;gap:10px;min-width:0}.nameText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon{font-size:18px;width:22px}.folder .icon{color:var(--folder)}.size.pending{color:var(--muted)}.mini{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}.mini>span{display:block;height:100%;background:var(--accent);width:35%;animation:slide 1.2s infinite ease-in-out}.error{color:var(--danger)}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.hint{font-size:12px;color:var(--muted)}
@media(max-width:650px){.app{padding:10px}.header{align-items:flex-start;flex-direction:column}th:nth-child(3),td:nth-child(3){display:none}th:nth-child(2),td:nth-child(2){width:125px}th,td{padding:10px 9px}}
</style>
</head>
<body><div class="app">
<div class="header"><div class="title"><h1>Velikost složek</h1><p>Průzkumník s rekurzivním výpočtem velikosti složek</p></div><button id="pick" class="primary">Vybrat složku</button></div>
<div class="panel">
 <div class="toolbar"><button id="back" title="O úroveň výš" disabled>← Zpět</button><button id="refresh" title="Načíst znovu" disabled>↻ Obnovit</button><div id="crumbs" class="crumbs"><span class="hint">Nejprve vyberte složku</span></div></div>
 <div class="progressWrap"><div id="progress" class="progress"></div></div>
 <div id="status" class="status">Připraveno</div>
 <div id="content"><div class="empty">Klikněte na <b>Vybrat složku</b>. Data zůstávají pouze ve vašem počítači.</div></div>
</div></div>
<script>
'use strict';
const $=s=>document.querySelector(s), pick=$('#pick'), back=$('#back'), refresh=$('#refresh'), crumbs=$('#crumbs'), content=$('#content'), statusEl=$('#status'), progress=$('#progress');
let root=null, current=null, path=[], generation=0, entries=[], sort={key:'name',dir:1};
const fmt=n=>{if(n==null)return 'Počítám…'; const u=['B','KB','MB','GB','TB','PB'];let i=0,v=n;while(v>=1024&&i<u.length-1){v/=1024;i++}return `${new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:i?2:0}).format(v)} ${u[i]}`};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setProgress(done,total,active=true){progress.classList.remove('indeterminate');if(!active){progress.style.width='0';return} if(!total){progress.style.width='0';progress.classList.add('indeterminate')}else progress.style.width=(done/total*100)+'%'}
function renderCrumbs(){crumbs.innerHTML=''; path.forEach((p,i)=>{if(i)crumbs.insertAdjacentHTML('beforeend','<span class="sep">›</span>');const e=document.createElement('span');e.className='crumb';e.textContent=p.name;e.onclick=()=>goTo(i);crumbs.appendChild(e)});back.disabled=path.length<2;refresh.disabled=!current}
function sorted(){return [...entries].sort((a,b)=>{if(a.kind!==b.kind)return a.kind==='directory'?-1:1;let x=sort.key==='size'?(a.size??-1):a.name.toLocaleLowerCase('cs');let y=sort.key==='size'?(b.size??-1):b.name.toLocaleLowerCase('cs');return (typeof x==='number'?x-y:x.localeCompare(y,'cs'))*sort.dir})}
function render(){if(!entries.length){content.innerHTML='<div class="empty">Tato složka je prázdná.</div>';return}let rows=sorted().map(e=>`<tr class="${e.kind==='directory'?'folder':''}" data-id="${e.id}"><td><div class="name"><span class="icon">${e.kind==='directory'?'📁':'📄'}</span><span class="nameText" title="${esc(e.name)}">${esc(e.name)}</span></div></td><td class="size ${e.pending?'pending':''} ${e.error?'error':''}">${e.error?'Nelze načíst':fmt(e.size)}${e.pending?'<div class="mini"><span></span></div>':''}</td><td>${e.kind==='directory'?'Složka':'Soubor'}</td></tr>`).join('');content.innerHTML=`<table><thead><tr><th data-sort="name">Název</th><th data-sort="size">Velikost</th><th>Typ</th></tr></thead><tbody>${rows}</tbody></table>`;content.querySelectorAll('tr.folder').forEach(tr=>tr.ondblclick=tr.onclick=()=>openFolder(Number(tr.dataset.id)));content.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{let k=th.dataset.sort;sort.dir=sort.key===k?-sort.dir:1;sort.key=k;render()})}
async function load(handle,newPath){const my=++generation;current=handle;path=newPath;entries=[];renderCrumbs();content.innerHTML='<div class="empty">Načítám obsah…</div>';statusEl.textContent='Načítám seznam položek…';setProgress(0,0,true);let id=0;try{for await(const [name,h] of handle.entries()){if(my!==generation)return;entries.push({id:id++,name,handle:h,kind:h.kind,size:null,pending:h.kind==='directory',error:false});if(h.kind==='file'){try{const f=await h.getFile();entries.at(-1).size=f.size}catch{entries.at(-1).error=true}}}render();const dirs=entries.filter(e=>e.kind==='directory');statusEl.textContent=dirs.length?`Počítám velikost složek: 0 z ${dirs.length}`:`Načteno ${entries.length} položek`;setProgress(0,dirs.length,!!dirs.length);let done=0;for(const e of dirs){calcSize(e.handle,my).then(size=>{if(my!==generation)return;e.size=size;e.pending=false;done++;statusEl.textContent=`Počítám velikost složek: ${done} z ${dirs.length}`;setProgress(done,dirs.length,true);render();if(done===dirs.length){statusEl.textContent=`Hotovo. Načteno ${entries.length} položek.`;setTimeout(()=>{if(my===generation)setProgress(0,0,false)},500)}}).catch(()=>{if(my!==generation)return;e.pending=false;e.error=true;done++;setProgress(done,dirs.length,true);render()})}if(!dirs.length)setProgress(0,0,false)}catch(err){content.innerHTML=`<div class="empty error">Složku se nepodařilo načíst.<br>${esc(err.message)}</div>`;statusEl.textContent='Chyba při načítání';setProgress(0,0,false)}}
async function calcSize(dir,my){let total=0,stack=[dir],steps=0;while(stack.length){if(my!==generation)throw new Error('cancel');const d=stack.pop();for await(const h of d.values()){if(my!==generation)throw new Error('cancel');if(h.kind==='file'){try{total+=(await h.getFile()).size}catch{}}else stack.push(h);if(++steps%80===0)await new Promise(r=>setTimeout(r,0))}}return total}
function openFolder(id){const e=entries.find(x=>x.id===id);if(e&&e.kind==='directory')load(e.handle,[...path,{name:e.name,handle:e.handle}])}
function goTo(i){load(path[i].handle,path.slice(0,i+1))}
pick.onclick=async()=>{if(!window.showDirectoryPicker){alert('Tento prohlížeč nepodporuje výběr složky. Použijte aktuální Microsoft Edge nebo Google Chrome.');return}try{root=await window.showDirectoryPicker({mode:'read'});load(root,[{name:root.name,handle:root}])}catch(e){if(e.name!=='AbortError')alert('Složku nelze otevřít: '+e.message)}};
back.onclick=()=>path.length>1&&goTo(path.length-2);refresh.onclick=()=>current&&load(current,[...path]);
</script></body></html>
