<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Průzkumník složek v11</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--accent2:#60a5fa;--hover:#eff6ff;--folder:#e7a928;--danger:#b42318;--ok:#067647;--chip:#eef4ff}
@media(prefers-color-scheme:dark){:root{--bg:#101828;--panel:#182230;--text:#f2f4f7;--muted:#98a2b3;--line:#344054;--hover:#1d2939;--chip:#243b64;--ok:#6ce9a6}}
:root[data-theme=light]{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--accent2:#60a5fa;--hover:#eff6ff;--folder:#e7a928;--danger:#b42318;--ok:#067647;--chip:#eef4ff}
:root[data-theme=dark]{color-scheme:dark;--bg:#101828;--panel:#182230;--text:#f2f4f7;--muted:#98a2b3;--line:#344054;--hover:#1d2939;--chip:#243b64;--ok:#6ce9a6}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1280px;margin:auto;padding:22px}.header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:15px}.title h1{font-size:23px;margin:0}.title p{margin:4px 0 0;color:var(--muted);font-size:13px}
button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer}button:hover{background:var(--hover)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--danger)}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #0000000b}.toolbar{padding:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}.crumbs{display:flex;gap:4px;align-items:center;flex:1;min-width:250px;overflow:auto}.crumb{white-space:nowrap;padding:6px 8px;border-radius:7px;cursor:pointer}.crumb:hover{background:var(--hover)}.sep{color:var(--muted)}
.searchbar{padding:12px;display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:8px;border-bottom:1px solid var(--line);align-items:center}.searchbox{position:relative}.searchbox input{width:100%;padding:11px 38px 11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)}.clear{position:absolute;right:4px;top:3px;border:0;padding:6px 9px;background:transparent}.options{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}.options label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.progressWrap{height:5px;background:var(--line);position:relative;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}.progress.indeterminate{width:35%;animation:slide 1.2s infinite ease-in-out}@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
.status{padding:8px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.status strong{color:var(--text)}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600;user-select:none;cursor:pointer}th:nth-child(2),td:nth-child(2){width:160px;text-align:right}th:nth-child(3),td:nth-child(3){width:105px}th:nth-child(4),td:nth-child(4){width:245px;text-align:right}.rowActions{display:flex;gap:6px;justify-content:flex-end}.rowActions button{padding:6px 9px;font-size:12px;white-space:nowrap}tbody tr.folder{cursor:pointer}tbody tr:hover{background:var(--hover)}.name{display:flex;align-items:center;gap:10px;min-width:0}.nameText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pathText{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon{font-size:18px;width:22px}.thumb{width:52px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--bg);flex:0 0 auto}.thumbPlaceholder{width:52px;height:42px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:18px;flex:0 0 auto}.folder .icon{color:var(--folder)}.size.pending{color:var(--muted)}.error{color:var(--danger)}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.hint{font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--chip);font-size:11px;color:var(--accent)}.ok{color:var(--ok)}
@media(max-width:760px){.app{padding:10px}.header{align-items:flex-start;flex-direction:column}.searchbar{grid-template-columns:1fr}.options{justify-content:flex-start}th:nth-child(3),td:nth-child(3){display:none}th:nth-child(4),td:nth-child(4){width:135px}.rowActions{flex-direction:column;align-items:stretch}th:nth-child(2),td:nth-child(2){width:115px}th,td{padding:10px 9px}.actions{width:100%}.actions button{flex:1}}
</style>
</head>
<body><div class="app">
<div class="header"><div class="title"><h1>Průzkumník složek</h1><p>Rychlé hledání názvů a jednorázový výpočet velikostí</p></div><div class="actions"><button id="theme" title="Přepnout světlý a tmavý režim">☀ Světlý režim</button><button id="exportIndex" disabled>Exportovat index</button><button id="importIndex">Importovat index</button><input id="importFile" type="file" accept="application/json,.json" hidden><button id="stop" class="danger" disabled>Zastavit indexaci</button><button id="pick" class="primary">Vybrat složku</button></div></div>
<div class="panel">
 <div class="searchbar"><div class="searchbox"><input id="search" type="search" autocomplete="off" placeholder="Hledat v názvech a cestách…" disabled><button id="clear" class="clear" title="Vymazat hledání" type="button">×</button></div><div class="options"><label title="Uložit názvy souborů do indexu"><input id="indexFiles" type="checkbox"> Indexovat soubory</label><label title="Zobrazit indexované soubory ve výsledcích hledání"><input id="searchFiles" type="checkbox" disabled> Hledat v souborech</label><label><input id="sizes" type="checkbox" checked> Počítat velikosti</label></div><button id="reindex" disabled>↻ Znovu indexovat</button></div>
 <div class="toolbar"><button id="back" title="O úroveň výš" disabled>← Zpět</button><button id="refresh" title="Načíst aktuální složku" disabled>↻ Obnovit pohled</button><button id="thumbs" title="Zobrazit miniatury obrázků" disabled>▦ Zobrazit miniatury</button><div id="crumbs" class="crumbs"><span class="hint">Nejprve vyberte složku</span></div></div>
 <div class="progressWrap"><div id="progress" class="progress"></div></div>
 <div id="status" class="status"><span>Připraveno</span><span>Data zůstávají pouze ve vašem počítači.</span></div>
 <div id="content"><div class="empty">Klikněte na <b>Vybrat složku</b>. Složka se jednou projde a potom se v indexu hledá okamžitě.</div></div>
</div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),themeBtn=$('#theme'),exportBtn=$('#exportIndex'),importBtn=$('#importIndex'),importFile=$('#importFile'),pick=$('#pick'),stopBtn=$('#stop'),reindex=$('#reindex'),back=$('#back'),refresh=$('#refresh'),thumbsBtn=$('#thumbs'),crumbs=$('#crumbs'),content=$('#content'),statusEl=$('#status'),progress=$('#progress'),search=$('#search'),clearBtn=$('#clear'),indexFilesOpt=$('#indexFiles'),searchFilesOpt=$('#searchFiles'),sizesOpt=$('#sizes');
let root=null,index=[],byPath=new Map(),currentPath='',generation=0,indexing=false,indexStarted=0,lastIndexMs=null,lastSearchMs=null,indexedAt=null,importedIndex=false,showThumbs=false,thumbUrls=new Set(),sort={key:'name',dir:1},scan={visited:0,dirs:0,files:0,indexedFiles:0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=ms=>{if(ms==null)return '—';if(ms<1)return '< 1 ms';if(ms<1000)return `${ms.toFixed(ms<10?2:1)} ms`;const sec=ms/1000;if(sec<60)return `${sec.toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})} s`;const total=Math.floor(sec),s=total%60,mTotal=Math.floor(total/60),m=mTotal%60,h=Math.floor(mTotal/60);return h?`${h} h ${m} min ${s} s`:`${mTotal} min ${s} s`};
const fmt=n=>{if(n==null)return '—';const u=['B','KB','MB','GB','TB','PB'];let i=0,v=n;while(v>=1024&&i<u.length-1){v/=1024;i++}return `${new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:i?2:0}).format(v)} ${u[i]}`};
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('cs').replace(/[\s_\-./\\]+/g,'');
function setProgress(active){progress.classList.toggle('indeterminate',active);progress.style.width=active?'35%':'0'}
function setStatus(main,detail='Data zůstávají pouze ve vašem počítači.'){statusEl.innerHTML=`<span>${main}</span><span>${detail}</span>`}
function pathParts(p){return p?p.split('/') : []}
function renderCrumbs(){crumbs.innerHTML='';const parts=[root?.name,...pathParts(currentPath)].filter(Boolean);parts.forEach((name,i)=>{if(i)crumbs.insertAdjacentHTML('beforeend','<span class="sep">›</span>');const e=document.createElement('span');e.className='crumb';e.textContent=name;e.onclick=()=>openPath(parts.slice(1,i+1).join('/'));crumbs.appendChild(e)});back.disabled=!currentPath;refresh.disabled=!root}
function directChildren(path){return index.filter(e=>e.parent===path)}
function filtered(){const q=search.value.trim();if(q){const nq=norm(q);return index.filter(e=>(e.kind==='directory'||searchFilesOpt.checked)&&norm(e.name).includes(nq))}return directChildren(currentPath)}
function sorted(items){return [...items].sort((a,b)=>{if(a.kind!==b.kind)return a.kind==='directory'?-1:1;let x=sort.key==='size'?(a.size??-1):a.name.toLocaleLowerCase('cs');let y=sort.key==='size'?(b.size??-1):b.name.toLocaleLowerCase('cs');return (typeof x==='number'?x-y:x.localeCompare(y,'cs'))*sort.dir})}
function clearThumbUrls(){for(const u of thumbUrls)URL.revokeObjectURL(u);thumbUrls.clear()}
function isImageName(name){return /\.(?:png|jpe?g|gif|webp|bmp|avif)$/i.test(name)}
function render(){if(!root)return;clearThumbUrls();const isSearch=!!search.value.trim(),items=sorted(filtered());renderCrumbs();if(!items.length){content.innerHTML=`<div class="empty">${isSearch?'Nenalezena žádná odpovídající položka.':'Tato složka je prázdná.'}</div>`;return}const rows=items.slice(0,5000).map(e=>`<tr class="${e.kind==='directory'?'folder':''}" data-path="${esc(e.path)}"><td><div class="name">${showThumbs&&e.kind==='file'&&isImageName(e.name)?`<span class="thumbPlaceholder" data-thumb="${esc(e.path)}">◌</span>`:`<span class="icon">${e.kind==='directory'?'📁':'📄'}</span>`}<span class="nameText" title="${esc(e.name)}">${esc(e.name)}${isSearch?`<span class="pathText" title="${esc(e.path)}">${esc(e.path)}</span>`:''}</span></div></td><td class="size">${sizesOpt.checked?fmt(e.size):'—'}</td><td>${e.kind==='directory'?'Složka':'Soubor'}</td><td><div class="rowActions"><button type="button" class="copyPath" data-path="${esc(e.path)}">Kopírovat cestu</button>${e.kind==='file'?`<button type="button" class="previewFile" data-path="${esc(e.path)}">Otevřít náhled</button>`:''}</div></td></tr>`).join('');content.innerHTML=`<table><thead><tr><th data-sort="name">Název</th><th data-sort="size">Velikost</th><th>Typ</th><th>Akce</th></tr></thead><tbody>${rows}</tbody></table>${items.length>5000?'<div class="status">Zobrazeno prvních 5 000 výsledků. Zpřesněte hledání.</div>':''}`;content.querySelectorAll('tr.folder').forEach(tr=>tr.onclick=()=>{search.value='';openPath(tr.dataset.path)});if(showThumbs)loadVisibleThumbnails();content.querySelectorAll('.rowActions button').forEach(btn=>btn.onclick=e=>e.stopPropagation());content.querySelectorAll('.copyPath').forEach(btn=>btn.onclick=async e=>{e.stopPropagation();await copyRelativePath(btn.dataset.path,btn)});content.querySelectorAll('.previewFile').forEach(btn=>btn.onclick=async e=>{e.stopPropagation();await previewFile(btn.dataset.path)});content.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;sort.dir=sort.key===k?-sort.dir:1;sort.key=k;render()})}


async function loadVisibleThumbnails(){const slots=[...content.querySelectorAll('[data-thumb]')];let cursor=0;async function worker(){while(cursor<slots.length){const slot=slots[cursor++];const item=byPath.get(slot.dataset.thumb);if(!item||item.kind!=='file'||!slot.isConnected)continue;try{const file=await item.handle.getFile();if(!file.type.startsWith('image/')&&!isImageName(file.name))continue;const url=URL.createObjectURL(file);thumbUrls.add(url);const img=document.createElement('img');img.className='thumb';img.alt='Miniatura '+item.name;img.src=url;img.onload=()=>{if(slot.isConnected)slot.replaceWith(img);else URL.revokeObjectURL(url)};img.onerror=()=>URL.revokeObjectURL(url)}catch{}}}await Promise.all(Array.from({length:Math.min(4,slots.length)},worker))}
async function copyRelativePath(path,button){try{await navigator.clipboard.writeText(path);const old=button.textContent;button.textContent='Zkopírováno';setTimeout(()=>button.isConnected&&(button.textContent=old),1200)}catch{const ta=document.createElement('textarea');ta.value=path;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();const old=button.textContent;button.textContent='Zkopírováno';setTimeout(()=>button.isConnected&&(button.textContent=old),1200)}}
async function previewFile(path){const item=byPath.get(path);if(!item||item.kind!=='file')return;if(!item.handle){setStatus('<span class="error">Náhled není v importovaném indexu dostupný.</span>','Pro otevření souboru znovu vyberte původní složku.');return}try{const file=await item.handle.getFile();const url=URL.createObjectURL(file);const win=window.open(url,'_blank','noopener');if(!win){URL.revokeObjectURL(url);setStatus('<span class="error">Náhled byl zablokován prohlížečem.</span>','Povolte vyskakovací okna pro tuto stránku.');return}setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){setStatus('<span class="error">Soubor nelze otevřít v náhledu.</span>',esc(e.message||'Nepodporovaný formát nebo chybějící oprávnění.'))}}
function openPath(path){currentPath=path;search.value='';render();if(indexing){const count=directChildren(path).length;setStatus(`<strong>${esc(path||root.name)}</strong> · ${count} položek`,'Indexace stále probíhá.')}else{const d=index.filter(x=>x.kind==='directory').length,f=index.length-d;setStatus(`<strong>Indexace dokončena${lastIndexMs!=null?` za ${fmtTime(lastIndexMs)}`:''}.</strong> Indexováno: ${d.toLocaleString('cs-CZ')} složek a ${f.toLocaleString('cs-CZ')} souborů.`,scan.visited?`Zkontrolováno ${scan.visited.toLocaleString('cs-CZ')} položek (${scan.files.toLocaleString('cs-CZ')} souborů nalezeno).`:indexedAt?`Indexováno ${indexedAt.toLocaleString('cs-CZ')}${lastIndexMs!=null?` za ${fmtTime(lastIndexMs)}`:''}.`:'')}}
async function walk(dir,parent,my){const maxWorkers=8,queue=[{dir,parent}],directSizes=new Map();let active=0,done=false,lastUi=0;function updateUi(){const now=performance.now();if(now-lastUi<120)return;lastUi=now;setStatus(`<strong>Indexuji…</strong> ${scan.visited.toLocaleString('cs-CZ')} zkontrolovaných položek`,`${scan.dirs.toLocaleString('cs-CZ')} složek · ${scan.files.toLocaleString('cs-CZ')} souborů nalezeno · ${index.length.toLocaleString('cs-CZ')} položek uloženo`)}async function processDir(job){let own=0,fileBatch=[];async function flush(){if(!fileBatch.length)return;const vals=await Promise.all(fileBatch.splice(0));for(const n of vals)own+=n}for await(const [name,h] of job.dir.entries()){if(my!==generation)throw new Error('cancel');scan.visited++;const path=job.parent?job.parent+'/'+name:name;if(h.kind==='file'){scan.files++;if(sizesOpt.checked){fileBatch.push(h.getFile().then(f=>f.size).catch(()=>0));if(fileBatch.length>=64)await flush()}if(indexFilesOpt.checked){const item={name,path,parent:job.parent,kind:h.kind,handle:h,size:null};index.push(item);byPath.set(path,item);scan.indexedFiles++;if(sizesOpt.checked)item._sizePromise=h.getFile().then(f=>f.size).catch(()=>0)}}else{scan.dirs++;const item={name,path,parent:job.parent,kind:h.kind,handle:h,size:null};index.push(item);byPath.set(path,item);queue.push({dir:h,parent:path})}updateUi()}await flush();directSizes.set(job.parent,own)}return await new Promise((resolve,reject)=>{function pump(){if(done)return;if(my!==generation){done=true;reject(new Error('cancel'));return}while(active<maxWorkers&&queue.length){const job=queue.shift();active++;processDir(job).then(()=>{active--;if(!queue.length&&!active){done=true;resolve()}else pump()}).catch(e=>{if(!done){done=true;reject(e)}})}if(!queue.length&&!active&&!done){done=true;resolve()}}pump()}).then(async()=>{if(sizesOpt.checked){const files=index.filter(x=>x.kind==='file'&&x._sizePromise);await Promise.all(files.map(async x=>{x.size=await x._sizePromise;dele async function buildIndex(){if(!root)return;const my=++generation;indexing=true;indexStarted=performance.now();indexedAt=new Date();importedIndex=false;lastIndexMs=null;scan={visited:0,dirs:0,files:0,indexedFiles:0};index=[];byPath.clear();currentPath='';search.value='';pick.disabled=true;reindex.disabled=true;exportBtn.disabled=true;stopBtn.disabled=false;search.disabled=false;thumbsBtn.disabled=false;setProgress(true);setStatus('<strong>Indexuji vybranou složku…</strong>','Hledání lze používat už během indexace.');renderCrumbs();content.innerHTML='<div class="empty">Načítám názvy, cesty a velikosti…</div>';try{await walk(root,'',my);if(my!==generation)return;indexing=false;lastIndexMs=performance.now()-indexStarted;setProgress(false);pick.disabled=false;reindex.disabled=false;exportBtn.disabled=false;stopBtn.disabled=true;thumbsBtn.disabled=false;const d=scan.dirs,f=scan.indexedFiles;setStatus(`<strong>Indexace dokončena za ${fmtTime(lastIndexMs)}.</strong> Indexováno: ${d.toLocaleString('cs-CZ')} složek a ${f.toLocaleString('cs-CZ')} souborů.`,`Zkontrolováno ${scan.visited.toLocaleString('cs-CZ')} položek (${scan.files.toLocaleString('cs-CZ')} souborů nalezeno).`);render()}catch(e){if(e.message!=='cancel'){setStatus('<span class="error">Indexaci se nepodařilo dokončit.</span>',esc(e.message))}indexing=false;setProgress(false);pick.disabled=false;reindex.disabled=false;exportBtn.disabled=!index.length;stopBtn.disabled=true;render()}}
function safeFileStamp(date){const p=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}_${p(date.getHours())}-${p(date.getMinutes())}-${p(date.getSeconds())}`}
function exportIndex(){if(!root||!index.length)return;const when=indexedAt||new Date();const fileName=`Index slozky ${root.name} ${safeFileStamp(when)}.json`;const payload={format:'pruzkumnik-slozek-index',version:1,rootName:root.name,indexedAt:when.toISOString(),durationMs:lastIndexMs,options:{indexFiles:indexFilesOpt.checked,sizes:sizesOpt.checked},items:index.map(({name,path,parent,kind,size})=>({name,path,parent,kind,size}))};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);setStatus('<strong>Index byl exportován.</strong>',esc(fileName))}
async function importIndexFile(file){let data;try{data=JSON.parse(await file.text())}catch{throw new Error('Soubor není platný JSON.')}if(data?.format!=='pruzkumnik-slozek-index'||!Array.isArray(data.items)||typeof data.rootName!=='string')throw new Error('Soubor nemá podporovaný formát indexu.');generation++;indexing=false;clearThumbUrls();root={name:data.rootName};index=data.items.filter(e=>e&&typeof e.name==='string'&&typeof e.path==='string'&&typeof e.parent==='string'&&(e.kind==='directory'||e.kind==='file')).map(e=>({name:e.name,path:e.path,parent:e.parent,kind:e.kind,size:Number.isFinite(e.size)?e.size:null,handle:null}));byPath=new Map(index.map(e=>[e.path,e]));currentPath='';search.value='';indexedAt=data.indexedAt?new Date(data.indexedAt):null;if(indexedAt&&!Number.isFinite(indexedAt.getTime()))indexedAt=null;lastIndexMs=Number.isFinite(data.durationMs)?data.durationMs:null;importedIndex=true;indexFilesOpt.checked=index.some(e=>e.kind==='file');searchFilesOpt.disabled=!indexFilesOpt.checked;searchFilesOpt.checked=false;sizesOpt.checked=index.some(e=>e.size!=null);pick.disabled=false;reindex.disabled=true;stopBtn.disabled=true;search.disabled=false;thumbsBtn.disabled=true;exportBtn.disabled=!index.length;setProgress(false);render();const d=index.filter(x=>x.kind==='directory').length,f=index.length-d;setStatus(`<strong>Index importován.</strong> ${d.toLocaleString('cs-CZ')} složek a ${f.toLocaleString('cs-CZ')} souborů.`,indexedAt?`Indexováno ${indexedAt.toLocaleString('cs-CZ')}${lastIndexMs!=null?` za ${fmtTime(lastIndexMs)}`:''}.`:'Čas původní indexace není uložen.')}
function applyTheme(mode){document.documentElement.dataset.theme=mode;themeBtn.textContent=mode==='light'?'☾ Tmavý režim':'☀ Světlý režim';themeBtn.title=mode==='light'?'Přepnout na tmavý režim':'Přepnout na světlý režim'}
let themeMode='light';applyTheme(themeMode);
themeBtn.onclick=()=>{themeMode=themeMode==='light'?'dark':'light';applyTheme(themeMode)};exportBtn.onclick=exportIndex;importBtn.onclick=()=>importFile.click();importFile.onchange=async()=>{const file=importFile.files[0];if(!file)return;try{await importIndexFile(file)}catch(e){setStatus('<span class="error">Import indexu se nezdařil.</span>',esc(e.message))}finally{importFile.value=''}};
pick.onclick=async()=>{if(!window.showDirectoryPicker){alert('Tento prohlížeč nepodporuje výběr složky. Použijte aktuální Microsoft Edge nebo Google Chrome.');return}try{root=await window.showDirectoryPicker({mode:'read'});await buildIndex()}catch(e){if(e.name!=='AbortError')alert('Složku nelze otevřít: '+e.message)}};
stopBtn.onclick=()=>{generation++;indexing=false;lastIndexMs=indexStarted?performance.now()-indexStarted:null;setProgress(false);pick.disabled=false;reindex.disabled=false;exportBtn.disabled=!index.length;stopBtn.disabled=true;thumbsBtn.disabled=false;setStatus(`<strong>Indexace zastavena po ${fmtTime(lastIndexMs)}.</strong> Zachováno ${index.length.toLocaleString('cs-CZ')} položek.`,'Ve výsledcích lze dále hledat.');render()};
document.addEventListener('keydown',e=>{if(e.key!=='Backspace'||e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey)return;const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;if(root&&currentPath){e.preventDefault();openPath(pathParts(currentPath).slice(0,-1).join('/'))}});
reindex.onclick=buildIndex;thumbsBtn.onclick=()=>{showThumbs=!showThumbs;thumbsBtn.textContent=showThumbs?'▦ Skrýt miniatury':'▦ Zobrazit miniatury';thumbsBtn.title=showThumbs?'Skrýt miniatury obrázků':'Zobrazit miniatury obrázků';render()};back.onclick=()=>openPath(pathParts(currentPath).slice(0,-1).join('/'));refresh.onclick=render;search.oninput=()=>{const t0=performance.now();render();const n=filtered().length;lastSearchMs=performance.now()-t0;const d=index.filter(x=>x.kind==='directory').length,f=index.length-d;setStatus(search.value.trim()?`Nalezeno <strong>${n.toLocaleString('cs-CZ')}</strong> výsledků za <strong>${fmtTime(lastSearchMs)}</strong>`:`<strong>${esc(currentPath||root?.name||'')}</strong>`,indexing?'Indexace stále probíhá.':`Indexováno ${d.toLocaleString('cs-CZ')} složek a ${f.toLocaleString('cs-CZ')} souborů${lastIndexMs!=null?` za ${fmtTime(lastIndexMs)}`:''}.`)};clearBtn.onclick=()=>{search.value='';search.focus();render()};indexFilesOpt.onchange=()=>{searchFilesOpt.disabled=!indexFilesOpt.checked;if(!indexFilesOpt.checked)searchFilesOpt.checked=false;if(root&&!indexing)setStatus('<strong>Nastavení indexace změněno.</strong>','Pro uplatnění spusťte Znovu indexovat.');render()};searchFilesOpt.onchange=render;sizesOpt.onchange=()=>{if(root&&!indexing)setStatus('<strong>Nastavení výpočtu velikostí změněno.</strong>','Pro uplatnění spusťte Znovu indexovat.');render()};
</script></body></html>
