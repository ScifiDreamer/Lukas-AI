</style></head><body><div class="wrap"><header><h1>Mapa fotografií</h1><div class="actions"><button id="removeNoGps" class="danger" hidden>🗑 Bez GPS</button><button id="clear" hidden>Vymazat vše</button></div></header>
<div id="androidHint" class="hint"><b>Android:</b> pro zachování GPS zabal fotografie ve správci souborů do ZIP a použij <b>Načíst ZIP</b>.</div>
<div class="settingsBox"><div class="settings"><button id="largeMode">Velké množství fotek</button><button id="listThumbs" title="Zobrazit nebo skrýt miniatury v seznamu">Miniatury v seznamu: vypnuto</button><label class="control">Paralelně <select id="parallel"><option>4</option><option selected>8</option><option>12</option></select>×</label><span class="muted">V režimu velkého množství se seznam úplně skryje.</span></div></div>
<div id="drop" class="drop"><div class="dropText"><b>Přetáhni sem fotografie nebo ZIP, případně použij tlačítka</b><div class="progressWrap" id="progressWrap"><div class="bar"><i id="bar"></i></div><div class="progress" id="progress"></div></div></div><div class="importActions"><button id="zipBtn" class="zipButton">Načíst ZIP</button><button id="folderBtn" class="primary">Vybrat složku</button><button id="filesBtn">Vybrat fotky</button><button id="cancel" class="danger" hidden>Zrušit</button></div><input id="zipInput" type="file" accept=".zip,application/zip" hidden><input id="folderInput" type="file" accept="image/*,.jpg,.jpeg,.heic,.heif,.tif,.tiff" webkitdirectory directory multiple hidden><input id="filesInput" type="file" accept="image/*,.jpg,.jpeg,.heic,.heif,.tif,.tiff" multiple hidden></div>
<div class="stats"><div class="stat"><strong id="all">0</strong>Načteno</div><div class="stat"><strong id="gps">0</strong>Na mapě</div><div class="stat"><strong id="nogps">0</strong>Bez GPS</div></div>
<div id="layout" class="layout"><section class="panel listPanel"><div class="panelTitle">Fotografie</div><div id="list" class="listViewport"><div id="listInner" class="listInner"><div class="empty">Zatím žádné fotografie</div></div></div></section><section id="mapPanel" class="panel mapPanel"><div class="mapActions"><button id="thumbMarkers" class="mapBtn" title="Zobrazit všechny fotografie jako miniatury"><span>Miniatury</span> ▧</button><button id="markerBtn" class="mapBtn"><span>Značky</span> ●</button><button id="routeBtn" class="mapBtn"><span>Trasa</span> ✓</button><button id="mapFull" class="mapBtn"><span>Celá obrazovka</span> ⛶</button></div><div id="map"></div></section></div></div>
<div id="viewer" class="viewer"><div class="viewerTop"><div id="viewerTitle" class="viewerTitle"><div id="viewerFile" class="viewerFile"></div><div id="viewerDevice" class="viewerDevice"></div></div><div class="viewerButtons"><button id="viewerClose">✕ Zavřít</button></div></div><img id="viewerImg" class="viewerImg" alt=""><div id="prevZone" class="navZone navPrev"><button class="navArrow">‹</button></div><div id="nextZone" class="navZone navNext"><button class="navArrow">›</button></div><div id="counter" class="counter"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const $=id=>document.getElementById(id),photos=[];let token=0,working=false,large=false,listThumbsOn=false,routeOn=true,markerMode='dots',viewerId=null,wheelLock=false,returnToMapFullscreen=false;const ROW=66,canvas=L.canvas({padding:.5}),map=L.map('map',{preferCanvas:true}).setView([49.82,15.47],7),markers=L.layerGroup().addTo(map),routes=L.layerGroup().addTo(map);L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty',attribution:'© OpenFreeMap © OpenMapTiles Data from OpenStreetMap'}).addTo(map);if(/Android/i.test(navigator.userAgent))$('androidHint').style.display='block';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const imageName=n=>/\.(jpe?g|heic|heif|tiff?)$/i.test(n)&&!/(^|\/)__MACOSX\//.test(n);
$('zipBtn').onclick=()=>$('zipInput').click();$('folderBtn').onclick=()=>$('folderInput').click();$('filesBtn').onclick=()=>$('filesInput').click();$('zipInput').onchange=e=>loadZip(e.target.files[0]);$('folderInput').onchange=e=>processFiles([...e.target.files].map(f=>({file:f,name:(f.webkitRelativePath||f.name).split('/').pop()})));$('filesInput').onchange=e=>processFiles([...e.target.files].map(f=>({file:f,name:f.name})));$('cancel').onclick=()=>{token++;setBusy(false,'Zrušeno.')};
['dragenter','dragover'].forEach(type=>$('drop').addEventListener(type,e=>{e.preventDefault();e.stopPropagation();$('drop').classList.add('drag')}));
['dragleave','drop'].forEach(type=>$('drop').addEventListener(type,e=>{e.preventDefault();e.stopPropagation();$('drop').classList.remove('drag')}));
$('drop').addEventListener('drop',e=>{const files=[...e.dataTransfer.files];const zip=files.find(f=>/\.zip$/i.test(f.name)||f.type==='application/zip');if(zip){loadZip(zip);return}const images=files.filter(f=>f.type.startsWith('image/')||imageName(f.name));if(images.length)processFiles(images.map(f=>({file:f,name:f.name}))) });
async function loadZip(file){if(!file||working)return;const my=++token;setBusy(true,'Otevírám ZIP…');try{const zip=await JSZip.loadAsync(file);const entries=Object.values(zip.files).filter(x=>!x.dir&&imageName(x.name));let n=0;const concurrency=Math.min(Number($('parallel').value),entries.length),items=[];async function worker(){while(n<entries.length&&my===token){const e=entries[n++],blob=await e.async('blob');items.push({file:new File([blob],e.name.split('/').pop(),{type:blob.type||'image/jpeg'}),name:e.name.split('/').pop()});progress(n,entries.length,e.name)}}await Promise.all(Array.from({length:concurrency},worker));if(my===token)await processFiles(items,my)}catch(e){setBusy(false,'ZIP se nepodařilo načíst: '+e.message)}}
async function processFiles(items,existingToken){if(!items.length||working&&!existingToken)return;const my=existingToken||++token;setBusy(true);let n=0;const concurrency=Math.min(Number($('parallel').value),items.length);async function worker(){while(n<items.length&&my===token){const item=items[n++],p={id:crypto.randomUUID(),name:item.name,file:item.file,url:null,hasGps:false};try{const [gps,meta]=await Promise.all([exifr.gps(item.file),exifr.parse(item.file,['DateTimeOriginal','CreateDate','Make','Model'])]);p.lat=gps?.latitude;p.lng=gps?.longitude;p.date=meta?.DateTimeOriginal||meta?.CreateDate;p.make=meta?.Make||'';p.model=meta?.Model||'';p.hasGps=Number.isFinite(p.lat)&&Number.isFinite(p.lng)}catch(e){}photos.push(p);progress(n,items.length,p.name);if(n%30===0)await new Promise(r=>setTimeout(r,0))}}await Promise.all(Array.from({length:concurrency},worker));if(my===token){setBusy(false,`Hotovo. GPS: ${photos.filter(p=>p.hasGps).length}`);render();fitMap()}$('zipInput').value=$('folderInput').value=$('filesInput').value=''}
function setBusy(on,msg=''){working=on;$('cancel').hidden=!on;$('progressWrap').style.display=on||msg?'block':'none';if(msg)$('progress').textContent=msg;if(!on&&msg)$('bar').style.width='100%'}function progress(n,total,name){$('bar').style.width=(n/total*100)+'%';$('progress').textContent=`${n} / ${total}: ${name}`}
function getUrl(p){return p.url||(p.url=URL.createObjectURL(p.file))}function release(p){if(p.url){URL.revokeObjectURL(p.url);p.url=null}}
function render(){const g=photos.filter(p=>p.hasGps).length;$('all').textContent=photos.length;$('gps').textContent=g;$('nogps').textContent=photos.length-g;$('clear').hidden=!photos.length;$('removeNoGps').hidden=photos.length===g;renderList();renderMarkers();drawRoute()}
$('list').onscroll=()=>requestAnimationFrame(renderList);function renderList(){const box=$('listInner');if(!photos.length){box.style.height='auto';box.innerHTML='<div class="empty">Zatím žádné fotografie</div>';return}box.style.height=photos.length*ROW+'px';const start=Math.max(0,Math.floor($('list').scrollTop/ROW)-2),end=Math.min(photos.length,Math.ceil(($('list').scrollTop+$('list').clientHeight)/ROW)+2);box.innerHTML='';for(let i=start;i<end;i++){const p=photos[i],r=document.createElement('div');r.className='photoRow';r.style.top=i*ROW+'px';const thumb=listThumbsOn?`<img class="listThumb" src="${getUrl(p)}" alt="">`:'';r.classList.toggle('withThumb',listThumbsOn);r.innerHTML=`${thumb}<div class="rowText"><div class="name">${esc(p.name)}</div><div class="meta ${p.hasGps?'':'nogps'}">${p.hasGps?'● GPS':'⚠ Bez GPS'} ${p.date?' · '+new Date(p.date).toLocaleString('cs-CZ'):''}</div></div><button class="trash">🗑</button>`;r.onclick=e=>{if(!e.target.closest('.trash'))openViewer(p.id)};r.querySelector('.trash').onclick=e=>{e.stopPropagation();removePhoto(p.id)};box.appendChild(r)}}
function popup(p){return `<div class="popup"><img class="popupPreview" src="${getUrl(p)}"><b class="popupName">${esc(p.name)}</b><div class="popupActions"><button onclick="openViewer('${p.id}')">⛶ Zvětšit</button><button class="danger" onclick="removePhoto('${p.id}')">🗑 Smazat</button></div></div>`}function renderMarkers(){markers.clearLayers();photos.filter(p=>p.hasGps).forEach(p=>{let m;if(markerMode==='thumbs'){const icon=L.divIcon({className:'photoMarkerWrap',html:`<img class="photoMarker" src="${getUrl(p)}" alt="">`,iconSize:[54,54],iconAnchor:[27,27],popupAnchor:[0,-29]});m=L.marker([p.lat,p.lng],{icon})}else if(markerMode==='dots')m=L.circleMarker([p.lat,p.lng],{renderer:canvas,radius:4,color:'#fff',weight:1,fillColor:'#2563eb',fillOpacity:.95});else m=L.marker([p.lat,p.lng]);p.marker=m.bindPopup(()=>popup(p)).addTo(markers)})}
function ordered(){return photos.slice().sort((a,b)=>{const da=pdate(a),db=pdate(b);return da-db||a.name.localeCompare(b.name)});function pdate(p){const d=p.date?new Date(p.date).getTime():Infinity;return Number.isFinite(d)?d:Infinity}}
function drawRoute(){routes.clearLayers();if(!routeOn)return;const a=ordered().filter(p=>p.date);if(a.length>1)L.polyline(a.map(p=>[p.lat,p.lng]),{renderer:canvas,color:'#2563eb',weight:3,opacity:.7}).addTo(routes)}function fitMap(){const a=photos.filter(p=>p.hasGps);if(a.length===1)map.setView([a[0].lat,a[0].lng],14);else if(a.length>1)map.fitBounds(a.map(p=>[p.lat,p.lng]),{padding:[30,30],maxZoom:15})}function focusPhoto(p){if(p.hasGps){map.setView([p.lat,p.lng],16);p.marker.openPopup()}}
window.openViewer=async id=>{viewerId=id;returnToMapFullscreen=document.fullscreenElement===$('mapPanel');if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}showViewer();$('viewer').classList.add('open');document.body.style.overflow='hidden';try{await $('viewer').requestFullscreen()}catch(e){}};function showViewer(){const a=ordered(),i=a.findIndex(p=>p.id===viewerId);if(i<0){closeViewer();return}const p=a[i];$('viewerImg').src=getUrl(p);$('viewerFile').textContent=p.name+(p.date?' · '+new Date(p.date).toLocaleString('cs-CZ'):'');const make=String(p.make||'').trim(),model=String(p.model||'').trim();$('viewerDevice').textContent=make&&model?(model.toLowerCase().startsWith(make.toLowerCase())?model:make+' '+model):(make||model||'Zařízení neuvedeno v EXIF');$('counter').textContent=`${i+1} / ${a.length}`}function moveViewer(step){const a=ordered(),i=a.findIndex(p=>p.id===viewerId);if(!a.length)return;viewerId=a[(i+step+a.length)%a.length].id;showViewer()}async function closeViewer(){const restore=returnToMapFullscreen;returnToMapFullscreen=false;if(document.fullscreenElement===$('viewer')){try{await document.exitFullscreen()}catch(e){}}$('viewer').classList.remove('open');$('viewerImg').src='';viewerId=null;document.body.style.overflow='';if(restore){try{await $('mapPanel').requestFullscreen();setTimeout(()=>map.invalidateSize(),100)}catch(e){}}}$('viewerClose').onclick=closeViewer;$('prevZone').onclick=()=>moveViewer(-1);$('nextZone').onclick=()=>moveViewer(1);$('viewer').addEventListener('wheel',e=>{e.preventDefault();if(wheelLock)return;wheelLock=true;moveViewer(e.deltaY>0?1:-1);setTimeout(()=>wheelLock=false,220)},{passive:false});document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('open'))return;if(e.key==='ArrowLeft')moveViewer(-1);if(e.key==='ArrowRight')moveViewer(1);if(e.key==='Escape')closeViewer()});
window.removePhoto=(id,fromViewer=false)=>{const i=photos.findIndex(p=>p.id===id);if(i<0)return;const next=fromViewer?ordered().findIndex(p=>p.id===id):-1;release(photos[i]);photos.splice(i,1);render();if(fromViewer){const a=ordered();if(!a.length)closeViewer();else{viewerId=a[Math.min(Math.max(next,0),a.length-1)].id;showViewer()}}};$('removeNoGps').onclick=()=>{for(let i=photos.length-1;i>=0;i--)if(!photos[i].hasGps){release(photos[i]);photos.splice(i,1)}render()};$('clear').onclick=()=>{token++;photos.forEach(release);photos.length=0;closeViewer();render();map.setView([49.82,15.47],7)};
$('listThumbs').onclick=()=>{listThumbsOn=!listThumbsOn;$('listThumbs').classList.toggle('active',listThumbsOn);$('listThumbs').textContent='Miniatury v seznamu: '+(listThumbsOn?'zapnuto':'vypnuto');renderList()};$('largeMode').onclick=()=>{large=!large;$('largeMode').classList.toggle('active',large);$('layout').classList.toggle('large',large);if(large&&markerMode==='thumbs'){markerMode='dots';$('thumbMarkers').classList.remove('active');$('markerBtn').innerHTML='<span>Značky</span> ●';renderMarkers()}setTimeout(()=>map.invalidateSize(),100)};$('thumbMarkers').onclick=()=>{markerMode=markerMode==='thumbs'?'dots':'thumbs';$('thumbMarkers').classList.toggle('active',markerMode==='thumbs');$('markerBtn').innerHTML='<span>Značky</span> ●';renderMarkers()};$('markerBtn').onclick=()=>{markerMode=markerMode==='dots'?'pins':'dots';$('thumbMarkers').classList.remove('active');$('markerBtn').innerHTML=markerMode==='dots'?'<span>Značky</span> ●':'<span>Značky</span> 📍';renderMarkers()};$('routeBtn').onclick=()=>{routeOn=!routeOn;$('routeBtn').innerHTML=`<span>Trasa</span> ${routeOn?'✓':'○'}`;drawRoute()};$('mapFull').onclick=async()=>{if(!document.fullscreenElement)await $('mapPanel').requestFullscreen();else await document.exitFullscreen()};document.addEventListener('fullscreenchange',()=>setTimeout(()=>map.invalidateSize(),100));render();
</script></body></html>
