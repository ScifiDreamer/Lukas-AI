<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porovnání tras</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#d8e0ea;--blue:#2563eb;--shadow:0 12px 32px #0f172a21}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{height:100%;display:grid;grid-template-columns:430px 1fr;overflow:hidden}.sidebar{background:#fff;z-index:1000;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;min-height:0}.head{padding:13px 15px 8px;border-bottom:1px solid var(--line);flex:none}h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;color:var(--muted)}.controls{padding:10px 14px;border-bottom:1px solid var(--line);flex:none}.searchrow{display:grid;grid-template-columns:42px 1fr 40px;gap:6px;margin-bottom:7px}.input,button,select{height:35px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}.input{min-width:0;padding:0 9px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb20}button{cursor:pointer;padding:0 9px;font-weight:650;color:#253044}button:hover{background:#f8fafc}.pick.active,.primary{background:var(--blue);border-color:var(--blue);color:#fff}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.actions button{font-size:12px}.full{grid-column:1/-1}.traffic.on{background:#dc2626;border-color:#dc2626;color:#fff}.hint{margin-top:7px;padding:7px 9px;border-radius:8px;background:#eff6ff;color:#1e40af;font-size:11px;line-height:1.35}.hint.ready{background:#ecfdf5;color:#065f46}.sortbar{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;flex:none}.sortbar select{height:29px;min-width:0;flex:1;font-size:11px}.results{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;padding:6px}.empty{padding:25px 12px;text-align:center;color:var(--muted);font-size:12px}.route{height:39px;border:1px solid var(--line);border-left:5px solid var(--route);border-radius:8px;margin-bottom:4px;background:#fff;display:grid;grid-template-columns:minmax(80px,1fr) 60px 58px 34px 28px 28px;gap:4px;align-items:center;padding:3px 4px;cursor:pointer;font-size:11px}.route:hover{background:#f8fafc}.route.selected{outline:2px solid var(--route);outline-offset:-1px}.route.fastest{background:#f0fdf4}.rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}.metric{text-align:right;white-space:nowrap}.color{width:26px;height:25px;padding:1px;border-radius:6px}.small{height:27px;width:27px;padding:0;border-radius:6px}.footer{padding:5px 11px;color:var(--muted);font-size:9px;border-top:1px solid var(--line);flex:none}.mapwrap{position:relative;min-width:0;min-height:0}#map{height:100%;width:100%;background:#dbe4ed}.maptip{position:absolute;z-index:700;left:50%;top:12px;transform:translateX(-50%);background:#0f172ae6;color:#fff;border-radius:20px;padding:8px 13px;font-size:11px;pointer-events:none;display:none}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:48% 52%}.sidebar{order:2}.mapwrap{order:1}.head{display:none}.controls{padding:7px}.footer{display:none}.route{grid-template-columns:minmax(70px,1fr) 55px 52px 32px 27px 27px}.input,button{height:32px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="head"><h1>Porovnání tras</h1><div class="sub">Start a cíl zadejte textem nebo tlačítkem a kliknutím do mapy.</div></div><div class="controls">
<div class="searchrow"><button class="pick" id="pickStart" title="Vybrat start v mapě">S</button><input id="startInput" class="input" placeholder="Start"><button id="startSearch" title="Vyhledat">⌕</button></div>
<div class="searchrow"><button class="pick" id="pickEnd" title="Vybrat cíl v mapě">C</button><input id="endInput" class="input" placeholder="Cíl"><button id="endSearch" title="Vyhledat">⌕</button></div>
<div class="actions"><button id="locateBtn">Moje poloha</button><button id="fitBtn">Zobrazit vše</button><button class="traffic" id="trafficBtn">Provoz: vyp.</button><button class="primary full" id="baseBtn">Vypočítat základní trasu</button><button id="clearViaBtn">Smazat alternativy</button><button id="clearAllBtn">Začít znovu</button></div><div class="hint" id="hint">Klikněte na S nebo C a potom do mapy.</div></div>
<div class="sortbar"><b>Seřadit:</b><select id="sort"><option value="created">pořadí vytvoření</option><option value="durationAsc">čas od nejkratšího</option><option value="durationDesc">čas od nejdelšího</option><option value="distanceAsc">vzdálenost od nejkratší</option><option value="distanceDesc">vzdálenost od nejdelší</option><option value="nameAsc">název A–Z</option><option value="nameDesc">název Z–A</option></select></div>
<div class="results" id="results"><div class="empty">Zatím není vypočítaná žádná trasa.</div></div><div class="footer">Mapy © OpenStreetMap. Bez provozu: OSRM. Aktuální provoz vyžaduje vlastní TomTom API klíč.</div></aside><main class="mapwrap"><div id="map"></div><div class="maptip" id="maptip"></div></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';const $=id=>document.getElementById(id),map=L.map('map').setView([49.9,15.3],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const els={start:$('startInput'),end:$('endInput'),hint:$('hint'),results:$('results'),tip:$('maptip')};let points={start:null,end:null},markers={start:null,end:null},routes=[],selectedId=null,busy=false,pickMode=null,traffic=false,trafficLayer=null,created=0;const colors=['#2563eb','#dc2626','#7c3aed','#ea580c','#0891b2','#db2777','#65a30d','#4f46e5','#b45309','#0f766e','#be123c','#475569'];
function hint(t,ok=false,load=false){els.hint.className='hint'+(ok?' ready':'');els.hint.innerHTML=(load?'<span class="spinner"></span>':'')+t}function fmtTime(s){let m=Math.round(s/60),h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`}function fmtKm(m){return `${(m/1000).toLocaleString('cs-CZ',{maximumFractionDigits:1})} km`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(l,c){return L.divIcon({className:'',html:`<div style="width:29px;height:29px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${c};border:3px solid white;box-shadow:0 2px 8px #0004"><b style="display:flex;transform:rotate(45deg);height:100%;align-items:center;justify-content:center;color:white;font:700 12px Segoe UI">${l}</b></div>`,iconSize:[29,29],iconAnchor:[14,29]})}
function setPoint(kind,ll,label){points[kind]=L.latLng(ll);els[kind].value=label||`${points[kind].lat.toFixed(5)}, ${points[kind].lng.toFixed(5)}`;if(markers[kind])map.removeLayer(markers[kind]);markers[kind]=L.marker(points[kind],{draggable:true,icon:icon(kind==='start'?'S':'C',kind==='start'?'#059669':'#dc2626')}).addTo(map);markers[kind].on('dragend',e=>{points[kind]=e.target.getLatLng();els[kind].value=`${points[kind].lat.toFixed(5)}, ${points[kind].lng.toFixed(5)}`;resetRoutes();hint('Bod přesunut. Znovu vypočítejte trasu.')});setPick(null);if(points.start&&points.end)hint('Můžete vypočítat trasu.',true)}
function setPick(kind){pickMode=kind;['Start','End'].forEach(x=>$('pick'+x).classList.toggle('active',kind===x.toLowerCase()));els.tip.style.display=kind?'block':'none';els.tip.textContent=kind==='start'?'Klikněte do mapy pro výběr startu':kind==='end'?'Klikněte do mapy pro výběr cíle':''}
async function geocode(kind){let q=els[kind].value.trim();if(!q)return;hint('Vyhledávám…',false,true);try{let r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=cs&q=${encodeURIComponent(q)}`),d=await r.json();if(!d.length)throw Error('Místo nebylo nalezeno.');setPoint(kind,[+d[0].lat,+d[0].lon],d[0].display_name);map.setView(points[kind],13)}catch(e){hint(e.message||'Vyhledávání selhalo.') }}
async function routeRequest(via){let ps=[points.start,...(via?[L.latLng(via)]:[]),points.end];if(traffic){let key=localStorage.getItem('tomtomKey');if(!key)throw Error('Provoz není aktivní, chybí TomTom API klíč.');let loc=ps.map(p=>`${p.lat},${p.lng}`).join(':');let u=`https://api.tomtom.com/routing/1/calculateRoute/${loc}/json?key=${encodeURIComponent(key)}&traffic=true&travelMode=car&routeType=fastest`;let r=await fetch(u),d=await r.json();if(!r.ok||!d.routes?.length)throw Error(d.detailedError?.message||'TomTom trasu nevypočítal.');let rr=d.routes[0];return{distance:rr.summary.lengthInMeters,duration:rr.summary.travelTimeInSeconds,geometry:{type:'LineString',coordinates:rr.legs.flatMap((l,i)=>l.points.map(p=>[p.longitude,p.latitude]).slice(i?1:0))}}}let cs=ps.map(p=>`${p.lng},${p.lat}`).join(';'),r=await fetch(`https://router.project-osrm.org/route/v1/driving/${cs}?overview=full&geometries=geojson`),d=await r.json();if(!r.ok||d.code!=='Ok'||!d.routes?.length)throw Error('Trasu se nepodařilo vypočítat.');return d.routes[0]}
async function addRoute(via=null,fit=false){if(busy||!points.start||!points.end)return hint('Nejprve nastavte start a cíl.');busy=true;hint('Počítám trasu…',false,true);try{let r=await routeRequest(via),id=crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),color=colors[routes.length%colors.length],name=via?`Alternativa ${routes.filter(x=>x.via).length+1}`:'Základní trasa',poly=L.geoJSON(r.geometry,{style:{color,weight:via?5:6,opacity:.78}}).addTo(map),viaMarker=via?L.circleMarker(via,{radius:6,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(map):null,entry={id,via:via?{lat:via.lat,lng:via.lng}:null,distance:r.distance,duration:r.duration,color,name,poly,viaMarker,created:created++};poly.on('click',()=>selectRoute(id,false));routes.push(entry);selectedId=id;styleRoutes();render();if(fit)fitAll();hint('Kliknutím do mapy přidáte alternativu.',true);setPick(null)}catch(e){hint(e.message||'Výpočet selhal.')}finally{busy=false}}
function resetRoutes(){routes.forEach(r=>{map.removeLayer(r.poly);if(r.viaMarker)map.removeLayer(r.viaMarker)});routes=[];selectedId=null;render()}function removeRoute(id){let r=routes.find(x=>x.id===id);if(!r)return;map.removeLayer(r.poly);if(r.viaMarker)map.removeLayer(r.viaMarker);routes=routes.filter(x=>x.id!==id);render()}function styleRoutes(){routes.forEach(r=>{r.poly.setStyle({color:r.color,weight:r.id===selectedId?8:(r.via?5:6),opacity:r.id===selectedId?1:.58});if(r.id===selectedId)r.poly.bringToFront();if(r.viaMarker)r.viaMarker.setStyle({fillColor:r.color})})}function selectRoute(id,zoom=true){selectedId=id;styleRoutes();render();let r=routes.find(x=>x.id===id);if(zoom&&r)map.fitBounds(r.poly.getBounds(),{padding:[35,35]})}
function sortedRoutes(){let a=[...routes],s=$('sort').value,dir=s.endsWith('Desc')?-1:1;if(s==='created')return a.sort((x,y)=>x.created-y.created);let key=s.startsWith('duration')?'duration':s.startsWith('distance')?'distance':'name';return a.sort((x,y)=>key==='name'?dir*x.name.localeCompare(y.name,'cs'):dir*(x[key]-y[key]))}
function render(){if(!routes.length){els.results.innerHTML='<div class="empty">Zatím není vypočítaná žádná trasa.</div>';return}let best=Math.min(...routes.map(r=>r.duration));els.results.innerHTML=sortedRoutes().map(r=>`<div class="route ${r.id===selectedId?'selected':''} ${r.duration===best?'fastest':''}" style="--route:${r.color}" data-id="${r.id}" title="${esc(r.name)}"><span class="rname">${esc(r.name)}</span><b class="metric">${fmtTime(r.duration)}</b><span class="metric">${fmtKm(r.distance)}</span><input class="color" type="color" value="${r.color}" title="Změnit barvu"><button class="small rename" title="Přejmenovat">✎</button><button class="small delete" title="Smazat">×</button></div>`).join('');els.results.querySelectorAll('.route').forEach(n=>{let id=n.dataset.id;n.onclick=()=>selectRoute(id,true);n.querySelector('.color').oninput=e=>{e.stopPropagation();let r=routes.find(x=>x.id===id);r.color=e.target.value;styleRoutes();n.style.setProperty('--route',r.color)};n.querySelector('.color').onclick=e=>e.stopPropagation();n.querySelector('.rename').onclick=e=>{e.stopPropagation();let r=routes.find(x=>x.id===id),v=prompt('Název trasy:',r.name);if(v&&v.trim()){r.name=v.trim();render()}};n.querySelector('.delete').onclick=e=>{e.stopPropagation();removeRoute(id)}})}
function fitAll(){let x=[];Object.values(markers).forEach(m=>m&&x.push(m));routes.forEach(r=>x.push(r.poly));if(x.length)map.fitBounds(L.featureGroup(x).getBounds(),{padding:[35,35]})}
$('pickStart').onclick=()=>setPick(pickMode==='start'?null:'start');$('pickEnd').onclick=()=>setPick(pickMode==='end'?null:'end');$('startSearch').onclick=()=>geocode('start');$('endSearch').onclick=()=>geocode('end');els.start.onkeydown=e=>e.key==='Enter'&&geocode('start');els.end.onkeydown=e=>e.key==='Enter'&&geocode('end');$('sort').onchange=render;$('baseBtn').onclick=()=>{resetRoutes();addRoute(null,true)};$('fitBtn').onclick=fitAll;$('clearViaBtn').onclick=()=>{[...routes].filter(r=>r.via).forEach(r=>removeRoute(r.id))};$('clearAllBtn').onclick=()=>{resetRoutes();Object.values(markers).forEach(m=>m&&map.removeLayer(m));markers={start:null,end:null};points={start:null,end:null};els.start.value=els.end.value='';setPick(null);hint('Klikněte na S nebo C a potom do mapy.')};$('locateBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>setPoint('start',[p.coords.latitude,p.coords.longitude],'Moje poloha'),()=>hint('Polohu nelze zjistit.')):hint('Prohlížeč polohu nepodporuje.');
$('trafficBtn').onclick=()=>{if(!traffic){let current=localStorage.getItem('tomtomKey')||'',key=prompt('Zadejte vlastní TomTom API klíč. Klíč zůstane uložen pouze v tomto prohlížeči:',current);if(!key)return;localStorage.setItem('tomtomKey',key.trim());traffic=true;trafficLayer=L.tileLayer(`https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=${encodeURIComponent(key.trim())}`,{opacity:.65,maxZoom:18}).addTo(map)}else{traffic=false;if(trafficLayer)map.removeLayer(trafficLayer);trafficLayer=null}$('trafficBtn').classList.toggle('on',traffic);$('trafficBtn').textContent=traffic?'Provoz: zap.':'Provoz: vyp.';if(routes.length)hint('Režim změněn. Pro přepočet klikněte na základní trasu.',true)};
map.on('click',e=>{if(pickMode)return setPoint(pickMode,e.latlng,pickMode==='start'?'Start z mapy':'Cíl z mapy');if(routes.length)addRoute(e.latlng,false)});window.addEventListener('resize',()=>map.invalidateSize());setTimeout(()=>map.invalidateSize(),100);
</script></body></html>
