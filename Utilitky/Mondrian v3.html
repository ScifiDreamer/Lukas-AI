<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generátor geometrických kompozic</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#e9e4d8;font-family:system-ui,sans-serif;color:#111}.app{width:min(1120px,100%);display:grid;grid-template-columns:1fr 350px;gap:25px;align-items:center}.frame{aspect-ratio:1;background:#111;padding:12px;box-shadow:0 18px 50px #0003}canvas{display:block;width:100%;height:100%;background:#f4f0e6}.panel{padding:27px;background:#ffffffdb;box-shadow:0 18px 50px #0002}.tag{color:#c52e28;font-size:12px;font-weight:900;letter-spacing:.15em}h1{font-size:42px;line-height:.95;margin:8px 0 18px}.intro{font-size:14px;line-height:1.5;color:#555}.buttons{display:grid;gap:11px}button{min-height:52px;border:2px solid #111;background:#fff;font-weight:900;cursor:pointer}button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px #111}#random{background:#f2c900}#balance{background:#1856a8;color:#fff}button:disabled{opacity:.4;transform:none;box-shadow:none;cursor:not-allowed}.meta{margin-top:15px;padding:10px;border:1px solid #bbb;font-size:13px}.meta strong{display:block;font-size:16px}dialog{width:min(760px,calc(100% - 24px));max-height:88vh;padding:0;border:3px solid #111;background:#f8f6ef;box-shadow:12px 12px #0005}dialog::backdrop{background:#0009}.dh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#111;color:#fff}.dh h2{margin:0}.close{min-height:36px;padding:5px 12px}.report{padding:22px;line-height:1.5}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{padding:13px;border:2px solid;background:#fff}.score strong{display:block;font-size:25px}.good{color:#16783d}.metric{display:grid;grid-template-columns:1.4fr .7fr .7fr;padding:7px 0;border-bottom:1px solid #ccc}.head{font-weight:900;border-bottom:2px solid}.sw{display:inline-block;width:12px;height:12px;border:1px solid #777;margin-right:6px}@media(max-width:780px){.app{grid-template-columns:1fr}.panel{order:-1}h1{font-size:34px}}
</style></head><body><main class="app"><section class="frame"><canvas id="art" width="1200" height="1200"></canvas></section><aside class="panel"><div class="tag">GENERÁTOR KOMPOZIC</div><h1>Barva.<br>Tvar. Rytmus.</h1><p class="intro">Random vytvoří novou nepravidelnou mřížku. Vyvážení zachová mřížku i přesný počet všech barev a pouze je přemístí do kompozičně vhodnějších oblastí.</p><div class="buttons"><button id="random">RANDOM</button><button id="balance">VYVÁŽIT BARVY</button><button id="details" disabled>CO A PROČ SE VYVÁŽILO</button></div><div class="meta">Režim<strong id="mode">Náhodný</strong></div></aside></main><dialog id="dlg"><div class="dh"><h2>Jak se kompozice vyvážila</h2><button class="close" id="close">ZAVŘÍT</button></div><div class="report" id="report"></div></dialog><script>
(()=>{const cv=document.querySelector('#art'),x=cv.getContext('2d'),mode=document.querySelector('#mode'),details=document.querySelector('#details'),dlg=document.querySelector('#dlg'),report=document.querySelector('#report');const C={w:'#f4f0e6',r:'#d62f27',b:'#1856a8',y:'#f2c900',k:'#111111'}, pal=[C.w,C.r,C.b,C.y,C.k];let S,last=null;const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function cuts(n){let a=Array.from({length:n},()=>rnd(.65,1.5)),z=a.reduce((p,q)=>p+q),o=[0],q=0;a.forEach(v=>{q+=v/z;o.push(q)});o[n]=1;return o}function weighted(){let n=Math.random()*100;for(const [c,w] of [[C.w,58],[C.r,13],[C.b,12],[C.y,12],[C.k,5]]){n-=w;if(n<=0)return c}return C.w}
function regions(R,K){let p=Array.from({length:R*K},(_,i)=>i),sz=Array(R*K).fill(1),f=i=>p[i]===i?i:p[i]=f(p[i]),E=[];for(let r=0;r<R;r++)for(let c=0;c<K;c++){if(c<K-1)E.push([r*K+c,r*K+c+1]);if(r<R-1)E.push([r*K+c,(r+1)*K+c])}E.sort(()=>Math.random()-.5);for(const[a,b]of E){let A=f(a),B=f(b),m=pick([2,2,3,4]);if(A!==B&&sz[A]+sz[B]<=m&&Math.random()<.27){p[B]=A;sz[A]+=sz[B]}}let M=new Map;for(let i=0;i<R*K;i++){let q=f(i);if(!M.has(q))M.set(q,[]);M.get(q).push(i)}return[...M.values()]}
function randomGrid(){let R=Math.floor(rnd(6,10)),K=Math.floor(rnd(6,10)),G=regions(R,K);S={R,K,X:cuts(K),Y:cuts(R),G,F:G.map(weighted)};last=null;details.disabled=true;mode.textContent='Náhodný';draw()}
function geo(){let owner=new Map;S.G.forEach((g,i)=>g.forEach(c=>owner.set(c,i)));let reg=S.G.map(g=>{let a=0,sx=0,sy=0;g.forEach(q=>{let r=Math.floor(q/S.K),c=q%S.K,A=(S.X[c+1]-S.X[c])*(S.Y[r+1]-S.Y[r]);a+=A;sx+=(S.X[c]+S.X[c+1])/2*A;sy+=(S.Y[r]+S.Y[r+1])/2*A});return{a,x:sx/a,y:sy/a}}),edges=[];for(let r=0;r<S.R;r++)for(let c=0;c<S.K;c++){let a=owner.get(r*S.K+c);if(c<S.K-1){let b=owner.get(r*S.K+c+1);if(a!==b)edges.push([a,b,S.Y[r+1]-S.Y[r]])}if(r<S.R-1){let b=owner.get((r+1)*S.K+c);if(a!==b)edges.push([a,b,S.X[c+1]-S.X[c]])}}return{reg,edges}}
function analyse(F,g){let W={[C.w]:.08,[C.y]:.72,[C.b]:.92,[C.r]:1,[C.k]:1.18},t=0,sx=0,sy=0;g.reg.forEach((q,i)=>{let m=q.a*W[F[i]];t+=m;sx+=q.x*m;sy+=q.y*m});let cx=sx/t,cy=sy/t,center=Math.hypot(cx-.5,cy-.5)*3.1,adj=0;g.edges.forEach(([a,b,l])=>{if(F[a]!==C.w&&F[b]!==C.w)adj+=l*(F[a]===F[b]?1.7:.22)});let spread=0,pc={};[C.r,C.b,C.y,C.k].forEach(c=>{let ids=F.map((v,i)=>v===c?i:-1).filter(i=>i>=0),area=ids.reduce((z,i)=>z+g.reg[i].a,0),px=area?ids.reduce((z,i)=>z+g.reg[i].x*g.reg[i].a,0)/area:.5,py=area?ids.reduce((z,i)=>z+g.reg[i].y*g.reg[i].a,0)/area:.5;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)spread+=Math.max(0,.24-Math.hypot(g.reg[ids[i]].x-g.reg[ids[j]].x,g.reg[ids[i]].y-g.reg[ids[j]].y))*.75;pc[c]={area,x:px,y:py,count:ids.length}});let role=0;g.reg.forEach((q,i)=>{if(F[i]===C.k)role+=Math.max(0,q.a-.055)*2.2;if(F[i]===C.r)role+=Math.max(0,q.a-.13)*.7;if(F[i]===C.y)role+=Math.max(0,q.a-.11)*.55;if(F[i]===C.b)role+=Math.max(0,.018-q.a)*.3});let penalty=center+adj+spread+role;return{penalty,score:Math.max(0,Math.round(100-penalty*100)),cx,cy,center,adj,spread,role,pc}}
function balance(){let g=geo(),orig=[...S.F],cur=[...orig],ca=analyse(cur,g),best=[...cur],ba=ca,steps=Math.max(7000,S.G.length*350);for(let k=0;k<steps;k++){let a=Math.floor(Math.random()*cur.length),b=Math.floor(Math.random()*cur.length);if(a===b||cur[a]===cur[b])continue;[cur[a],cur[b]]=[cur[b],cur[a]];let na=analyse(cur,g),temp=.12*(1-k/steps)+.002;if(na.penalty<ca.penalty||Math.random()<Math.exp((ca.penalty-na.penalty)/temp)){ca=na;if(na.penalty<ba.penalty){best=[...cur];ba=na}}else[cur[a],cur[b]]=[cur[b],cur[a]]}S.F=best;last={before:analyse(orig,g),after:ba,moved:best.filter((v,i)=>v!==orig[i]).length,total:best.length};details.disabled=false;mode.textContent='Kompozičně vyvážený';makeReport();draw()}
function pct(v){return(v*100).toFixed(1).replace('.',',')+' %'}function makeReport(){let b=last.before,a=last.after,n={[C.r]:'Červená',[C.b]:'Modrá',[C.y]:'Žlutá',[C.k]:'Černá'},rows=Object.keys(n).map(c=>`<div class="metric"><span><i class="sw" style="background:${c}"></i>${n[c]}</span><span>${pct(b.pc[c].area)}</span><span>${pct(a.pc[c].area)}</span></div>`).join('');report.innerHTML=`<p><strong>Mřížka ani počty barev se nezměnily.</strong> Algoritmus pouze prohazoval původní barvy mezi existujícími oblastmi.</p><div class="scores"><div class="score">Před<strong>${b.score}/100</strong></div><div class="score">Po<strong class="good">${a.score}/100</strong>+${a.score-b.score} bodů</div></div><h3>Co se změnilo</h3><ul><li>Barva se přesunula u <strong>${last.moved} z ${last.total}</strong> oblastí.</li><li>Vizuální těžiště: z (${pct(b.cx)}, ${pct(b.cy)}) na (${pct(a.cx)}, ${pct(a.cy)}), ideál je (50 %, 50 %).</li><li>Přesný počet bílé, červené, modré, žluté a černé zůstal zachován.</li></ul><h3>Plocha barev</h3><div class="metric head"><span>Barva</span><span>Před</span><span>Po</span></div>${rows}<h3>Proč je výsledek vyváženější</h3><ul><li><b>Vizuální těžiště:</b> černá a červená mají větší optickou váhu, bílá malou.</li><li><b>Sousedství:</b> stejné barvy vedle sebe a husté barevné shluky jsou penalizovány.</li><li><b>Rozptyl:</b> akcenty stejné barvy se rozmisťují do různých částí obrazu.</li><li><b>Role velikostí:</b> černá, červená a žlutá jsou preferovány jako menší akcenty; modrá může nést větší plochu.</li><li><b>Asymetrická rovnováha:</b> nejde o zrcadlení, ale o podobnou vizuální váhu kolem středu.</li></ul><p><b>Metoda:</b> simulované žíhání vyzkoušelo tisíce prohození a ponechalo nejlepší variantu. Skóre je kompoziční heuristika, ne univerzální estetická pravda.</p>`}
function draw(){let w=cv.width,h=cv.height,L=16,owner=new Map;S.G.forEach((g,i)=>g.forEach(c=>owner.set(c,i)));for(let r=0;r<S.R;r++)for(let c=0;c<S.K;c++){x.fillStyle=S.F[owner.get(r*S.K+c)];x.fillRect(S.X[c]*w,S.Y[r]*h,(S.X[c+1]-S.X[c])*w+1,(S.Y[r+1]-S.Y[r])*h+1)}x.strokeStyle=C.k;x.lineWidth=L;x.lineCap='square';for(let c=1;c<S.K;c++)for(let r=0;r<S.R;r++)if(owner.get(r*S.K+c-1)!==owner.get(r*S.K+c)){x.beginPath();x.moveTo(S.X[c]*w,S.Y[r]*h);x.lineTo(S.X[c]*w,S.Y[r+1]*h);x.stroke()}for(let r=1;r<S.R;r++)for(let c=0;c<S.K;c++)if(owner.get((r-1)*S.K+c)!==owner.get(r*S.K+c)){x.beginPath();x.moveTo(S.X[c]*w,S.Y[r]*h);x.lineTo(S.X[c+1]*w,S.Y[r]*h);x.stroke()}x.lineWidth=20;x.strokeRect(0,0,w,h)}
document.querySelector('#random').onclick=randomGrid;document.querySelector('#balance').onclick=balance;details.onclick=()=>{makeReport();dlg.showModal()};document.querySelector('#close').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')randomGrid();if(e.key.toLowerCase()==='v')balance()});randomGrid()})();
</script></body></html>
